 the legs of a runner in a way that means their limbs experience a greater impact with every stride. Juha-Pekka Kulmala at the University of Helsinki in Finland and his colleagues studied the biomechanics of 12 healthy men aged between 22 and 32 as they ran in two shoe types, always with the heel striking the ground before the toes, the most common running style. Barrier Reef begins to resist climate change"}, {"title": "Australia's Great Barrier Reef begins to resist climate change", "author": "Unknown", "content": "CAVAN IMAGES/PLAINPKTURE They first wore regular running shoes with 33 millimetres of cushioning under the heel and 22 millimetres under the forefoot, and then highly-cushioned shoes with a heel 43 millimetres thick and a forefoot of 37 millimetres. The participants ran at two set speeds —10 and 15 kilometres per hour—along a 30-metre platform that measured how hard their feet hit the ground. They also wore reflective stickers that allowed video cameras to capture - heatwaves in early 2016 and early 2017, causing half the coral to die. Terry Hughes at James Cook University in Australia and his colleagues flew over the reef to visually assess the level of coral bleaching after the two heatwaves. They found that even though the reef was exposed to more extreme temperatures in 2017, less bleaching occurred. It took about twice the amount of heat stress - for example the same elevated temperature but for twice as long - to cause the same level of damage in the second year as in the first, they calculated (Nature their motion for analysis. At both speeds, the runners landed on their feet harder when they wore the maximalist shoes than the regular kind. The peak impact force was 6 per cent higher on average at the slower running speed and 11 per cent higher at the faster speed. The video footage suggested this was because the runners bent their knees and ankles less when they wore the maximalist shoes, which caused their bodies to decelerate faster as they landed and put extra stress on their legs. Normally when we run, our legs act like springs, with the ankle and Pounding the pavements can lead to leg injuries Climate Change, doi.org/cxsw). One reason may be that corals are gradually adapting to the warmer climate by switching on different genes or other biochemical mechanisms, says Hughes, but this needs to be experimentally verified. Another reason may be that the corals that survived the first heatwave were tougher species, meaning they were better able to cope with the “In 50 years’ time, we will probably still have a reef, but it will look very different to today” knee joints bending, so that the leg as a whole compresses as the foot lands, says Kulmala. But because highly cushioned shoes already compress under the feet, our bodies subconsciously respond by no longer bending the leg joints as much. In other words, our legs become stiffer (Scientific Reports, doi.org/gfkpg9). This extra leg stiffness and higher impact means running in maximalist shoes may raise the risk of injuries, particularly stress fractures, says Kulmala. It also means that the common advice given to injury-prone runners to buy shoes with more padding may backfire, he says. Kade Paterson at the University of Melbourne in Australia says the findings make sense from a biomechanical point of view, but that long-term research is needed to see if maximalist shoes really do lead to more injuries. “as a sports podiatrist, I've seen patients who have reported improvements with maximalist running shoes and others who have got injured in them, so there probably isn’t a one-size-fits-all approach,” he says. The results don’t suggest that runners should opt for shoes with no padding, says Kulmala. For most people, a moderate amount of cushioning is likely to be best, he says. “Like many health-related things, we should be somewhere in the middle.” & second assault, says Hughes. His team previously found that dome-shaped corals were more likely to survive after the 2016 heatwave than branched and table corals. “The mix of species has already changed substantially and that trend is likely to continue,” he says. The loss of branched and table corals will probably have an impact on fish and other creatures on the reef, which use their nooks and crannies as refuges, says Hughes. “In 50 years’ time, we will probably still have a reef, butit will look very different to today,” he says. Alice Klein @"}, {"title": "AI poet learns by copying Shakespeare", "author": "Unknown", "content": "SHALLI compare thee to a summer's day? It's one of the most famous opening lines in poetry and comes from one of Shakespeare's best- known sonnets. Now artificial intelligence is trying to come up with its own version of the form. Sonnets come in many different variations but they always have 14 lines and usually include a regular rhyme scheme of some sort. Shakespeare pioneered his own version in which the lines were divided into three verses (or stanzas) of four lines (quatrains), finished with arhyming couplet. A team led by Jey Han Lau at IBM Research Australia decided to use deep learning, a type of artificial intelligence, to generate sonnets. The Al was trained on data from 2600 or so sonnets — around 367,000 words in total - taken from a free online database of out-of-copyright books called Project Gutenberg. The Al generated its own Shakespearean sonnet quatrains by first selecting a rhyming pattern and then generating one word at a time until it had completed a verse (arxiv. org/abs/1807.03491). When the team asked workers from a crowdsourcing website to rate the generated poems, they were unable to distinguish them from the real deal because of their strict adherence to rhyme and meter - but the often- nonsensical content meant that poetry experts were not so easily fooled. Poet and broadcaster Michael Symmons Roberts says the Al- generated sonnets do not come close to the “richness or complexity” of Shakespeare. And he points out that the Al wasn't able to emulate the “interweaving networks of meaning and emotion and beauty and purpose that make a poem”. “At the moment, intriguing as it is, Shakespeare wins it by a country mile,” he says. Aselection of the Al's best verses can be found at newscientist.com/ Al-shakespeare. Niall Firth @ 3 g 3 Pa g 8 A few drinks might help stave off dementia LIGHT drinking helps prevent dementia, and now we may know why: it revs up the brain’s waste disposal system. Brain cells are surrounded by a network of ultra-thin tubes that flush toxins and cell waste products away. Work in mice shows that low levels of alcohol stimulate this system, while higher amounts hinder it. If the findings apply to people, the low levels would be equivalent to about two units of alcohol a day, which is about a pint of beer ora medium glass of wine. Alcohol has been getting a bad press lately. Excessive drinking causes liver damage and has been linked with several kinds of cancer. In the UK, the recommendation for how much it is safe to drink has been cut, with both men and women advised to stick to 14 units or fewer a week. The latest UK government report said even drinking at very low levels carries some risk. However, this relates to a slightly higher rate of cancers that are fairly rare— such as those of the oesophagus. When it comes to more common conditions, such as dementia, total abstention from alcohol carries a slightly higher risk than low to moderate drinking. But it was unclear why. The reason may be the brain’s waste disposal system, known as the glymphatic system, which was only discovered in 2012. We know it ramps up its activity during sleep. Among the toxins it clears is a protein called beta-amyloid, which makes up the sticky “Abstention from alcohol causes a slightly higher risk of dementia than low to moderate drinking” plaques found in the brains of people with Alzheimer’s disease. Some studies have suggested that long-term sleep disruption may contribute to Alzheimer’s by causing amyloid build-up. Iben Lundgaard of the University of Rochester in New York and her colleagues looked at the effects of alcohol on this network, by injecting a dye into mouse brains then removing them half an hour later to see how much had got into the tubes. Low doses of alcohol boosted Here's to our health! A little bit of alcohol could be good for the brain the amount cleared by 40 percent compared with mice that had no alcohol. Intermediate and high doses had the opposite effect, cutting it by about 30 per cent. It is unclear how much that would affect people’s risk of Alzheimer’s. Roxana Carare of the University of Southampton, UK, says that the reason a low dose of alcohol has this effect may be because it raises the heart rate, and the pumping of blood helps drive fluid through the glymphatic system. “But there’s a lot we still don’t know about the normal functioning of the glymph system. We don’t know how this translates to humans.” At the Federation of European Neuroscience Societies meeting in Berlin last month, Lundgaard said that light drinking does seem to benefit the glymph system, but that more data would be needed before people make decisions about how much they drink based on this work, especially as it was in mice: “I think that would be a little bit too soon.” Lundgaard says that as well as considering how alcohol affects their risk of Alzheimer’s, people might also want to consider the effect on cancer. Clare Wilson @ 4 August 2018 | NewScientist | 7"}, {"title": "Something In the water", "author": "Colin Barras", "content": "By early 2015 the Flint authorities admitted that the water had initially contained potentially harmful contaminants, but stressed that it was now safe to drink. Hanna-Attisha had trusted that line. Born in the UK to Iraqi parents, Hanna- Attisha has lived in Michigan since she was a child; her father was a GM engineer. It was a chance conversation with a childhood and Mona Hanna-Attisha is hours away from the biggest moment of her scientific career. Then her phone rings. As she recalls in her new book, it was a representative from her medical school at Michigan State University, calling to say the institution wasn’t in a position to support her in what she was about to do. “I felt like I was being thrown undera bus,” she says. Hanna-Attisha was about to go public with some controversial and horrifying evidence: that the children in Flint, Michigan, were being poisoned by lead in the drinking water. Her revelation went against the state, the scientific consensus — and now her university. Just a month or so earlier, Hanna-Attisha had been urging the children in her care to drink the water in place of unhealthy sugary drinks — she felt it was her duty as an associate professor at MSU’s College of Medicine in Flint and a paediatrician in the city’s Hurley Medical Center. What had changed? Concerns had been growing about Flint’s water supply for well over a year. When car giant General Motors (GM), founded in Flint, began downsizing its operations there in 1978, the city’s economy went into a long decline. In April 2014, as a money-saving measure, the city stopped buying its water supply from nearby Detroit, opting instead to pull water from the Flint river. It wasn’t long before locals began to complain that the water smelled and tasted bad. | T’S the morning of 24 September 2015, friend that alerted her to the problem. The friend, an environmental engineer, told her about a report by Miguel Del Toral at the Environmental Protection Agency. He and Flint resident LeeAnne Walters had concluded Flint residents protested again and again about the state of their drinking water 42| NewScientist | 4 August 2018 Mona Hanna-Attisha, and the river at the centre of the crisis that the Flint River water was not being treated properly and as a result had begun to corrode the city’s aged water pipes. They reported lead in the water supply and speculated that it was coming from those pipes. There is no safe level of lead in drinking water. It affects every organ in the body and especially the nervous system. “Lead isa neurotoxin,” says Hanna-Attisha. “It is potent and its effects are irreversible.” Children are particularly vulnerable because their brains are still developing. “Even the lowest levels can cause steep declines in cognition,” she says. The level of lead in Flint’s water wasn’t low: some samples contained 13.2 milligrams of lead per litre. It wasn’t just unsafe to drink, it should have been handled as hazardous waste. “Tt was a call to action,” says Hanna-Attisha, x and she immediately tried to draw attention & to the problem. To her dismay, she says, the E authorities showed no desire to act. Even some & of her colleagues seemed unconcerned: they € agreed that children are at risk from paint- 3 lead was once added as a pigment — but not Papers from as early as the 1980s concluded that lead in water can leach into the body, but other studies found no clear link. Although the EPA considers water with a high lead concentration to be hazardous, this historical confusion seems to linger. If she was to change minds, Hanna-Attisha realised she would need evidence that lead levels in the blood of Flint residents had risen after the water switch. The clock was ticking: thousands of people were drinking Flint river water. But getting access to such data can take years. Whena similar crisis played out in Washington DC in the early 2000s, Marc Edwards of Virginia Tech in Blacksburg was only able to show that lead poisoning had occurred four years after the crisis ended. But Hanna-Attisha is a doctor and the Hurley Medical Center tests the blood lead levels of Flint’s children as part of routine healthcare. She already had the data. She and her team worked round the clock. “We checked, we double-checked, we triple- checked, we quadruple-checked this data,” she says, and the results were clear. The number of children with high levels of lead in their blood had risen significantly following the change in water supply. On 21 September, she went to the local authorities with her results, but she says they seemed unwilling to act. Hanna-Attisha felt she had no choice but to go public. As the hour of the press conference approached, the room filled with journalists and camera crews. Flanked by her team, Hanna-Attisha remembers her voice sounding calm and assured — even as her heart thudded in her “When the entire state is telling you you're wrong... it is hard not to believe them” chest. She had felt like the holder of an awful secret, and it was a relief to set it free. By early evening she was national news. Instead of being congratulated for her work, however, she found herself under attack. A spokesperson for the Michigan Department of Environmental Quality called her conclusions “unfortunate” in a time of “near hysteria”. The state governor's office went further, saying Hanna-Attisha’s team had “spliced and diced” the data. “That was definitely the lowest point,” she says. “When the entire state is telling you you're wrong, that feels like crap. And it’s hard not to believe them at a certain point.” Days passed. Hanna-Attisha says she was sick with worry. What if she was wrong and worrying people needlessly? Or, worse, she was right and nothing was going to happen? Then, suddenly, the local authority declared a public health emergency. On 1 October it announced that residents should drink bottled water or use water filters. Significantly, some reporters had analysed figures the state had released to counter Hanna-Attisha’s findings and found that they actually supported her claims. Her conclusions were accepted. A fortnight later, Flint was reconnected to Detroit’s water supply—something the state had spent months claiming wasn’t feasible. It was just 52 days since Hanna-Attisha had become aware of the lead problem. The full impact of the crisis remains to be seen. Some research suggests there was a rise in Flint’s miscarriage rate during the period water came from the Flint river. Other studies link the improperly treated water to an outbreak of Legionnaire’s disease in which 2 12 people died. Some people connected with 2 the Flint water crisis may face charges of 2 involuntary manslaughter. And there are & still some concerns around Flint’s water: all of the lead pipes need replacing, and that has not yet happened. Lead exposure causes permanent damage. The only option is to try to mitigate its effects, and that is where Hanna-Attisha is directing her attention. When | visit, she takes me on a tour of the Hurley centre. It’s an ultra-modern, colourful space, and is where she now leads the Pediatric Public Health Initiative, a multi- pronged project to provide as much health and social support as possible for Flint’s children. Although the parents coming and going from the centre with their children look just like parents everywhere, Hanna-Attisha says that below the surface they are angry — and anxious about what the future holds. Whatever that may be, there is no doubt Hanna-Attisha’s intervention prevented an even worse situation. When Washington DC had its lead problem, the people drank the water for more than three years. “It felt like I was the right person at the right time in the right place and with the right team,” she says. @ Colin Barras is a science writer based in Ann Arbor, Michigan. Mona Hanna-Attisha’s book What the Eyes Don't See: A story of crisis, resistance, and hope in an American city is out now (One World) 4 August 2018 | NewScientist | 43"}, {"title": "Paper batteries use bacteria to make electricity", "author": "Unknown", "content": "Paper batteries use bacteria to make electricity APAPER battery powered by electron-harvesting bacteria could one day power environmentally friendly disposable devices. Researchers have been working on paper sensors and circuit boards for years, but they have mostly been powered by traditional batteries o author": "Clare Wilson and Andy Coghlan", "content": "THE past century saw rapid growth in life expectancy, a key measure of progress. But no longer. UK figures released this month show that the life expectancy of people in the country, currently 79 for men and 83 for women, has started to rise more slowly. The change isn’t something to panic about — life expectancy isn’t falling, it’s just not rising as fast as it was. But it will have an impact. “potentially, it’s a really big societal, cultural and economic change that we are seeing,” says Nick Stripe at the UK’s Office for National Statistics (ONS), which produced the figures. Life expectancy is calculated from the proportion of deaths of people at each age. This death rate has been falling in all Western countries for decades, thanks to a raft of improvements in medicine and nutrition. The fall started to slow down in 2011 in the UK. At first it could have beena statistical fluke, but the latest mortality figures are now being classed as a real change. They mean that although life expectancy was previously climbing by about three months a year in women and four months a year in men, it is now two weeks and one month a year respectively (see graphs, below). Similar trends have been seen in other countries, such as the US, Australia and Germany, the ONS reported. However, that doesn’t mean this lower growth in life expectancy will become the norm. Some other countries, such as Japan, Denmark and Italy, have previously seen a slowdown in life expectancy increases, but then reverted to the old, higher rate. “The trend could reassert itself,” says Stripe. “We do not have enough data yet to say.” What happens next will have tremendous importance for the future of the UK. So what are the possible explanations for the In the UK and US, the average annual increase in life expectancy at birth has fallen, although this isn't the case with all rich nations @ Most recent six years ‘0 Males 15 10 Increase in life expectancy (weeks) {iui Lal ® Preceding six years Females SOURCE: OFFICE FOR NATIONAL STATISTICS slowdown? AS ty Ks SSS OS we SLAPS & “ » Fae WS ws Ss *2006-2016 **2005-2015 ***2004-2014 20 | NewScientist | 25 August 2018 SICK AT HEART for a long time we have been successfully reducing death rates from heart disease and stroke, but now the knock-on effects area major factor behind the unexpected backsliding in life expectancy, says the ONS. Death rates for these conditions plunged by 70 per cent in the past three decades, thanks in part to improvements in heart surgery. Anti-smoking campaigns and the introduction of drugs to lower blood pressure also both prevented heart attacks and stroke. Now many of those who benefited may be starting to die. One factor could be that the hearts of those saved by surgery eventually give out through heart failure, for which there is no effective treatment. Shifts to unhealthier habits could be another. Although smokers in the UK continue to quit — the biggest help to avoiding heart trouble— gains are now potentially being lost through poor diet and lack of exercise, says Rory Collins at the BEM NOSKOWSKIGETTY cause of death because of increased awareness and reduced stigma. But there is also a real rise in this condition. As more people survive heart attacks and cancer, they live long enough to get Alzheimer’s disease and other kinds of dementia. This in turn can cause pneumonia: people with dementia often have difficulty swallowing, which University of Oxford. leads to food entering the airways, triggering infections. DEADLY DEMENTIA. The rise in dementia cases is likely to persist because, unlike heart disease and cancer, we have noeffective therapies for it. “These numbers will continue torise in the absence of a new treatment,” says Matthew Norton of Alzheimer’s Research UK. More than two-thirds of deaths in the UK are in people over the age of 75, so most of the recent slowdown in life expectancy improvements is likely to stem from changes to death rates in this age group. The most obvious factor is an increasing number of deaths due to dementia. Some of this is down to doctors being more willing to put dementia as the AUSTERITY BITES Stalling life expectancy isn’t justan issue for older people. Since 2012, the death rates For daily news stories, visit newscientist.com/news among those aged 15 to 55 have also been increasing, mostly through accidents, assault or suicide. Although the number of deaths in this age group is too small to have much impact on headline life expectancy figures, the trend could bea sign of something larger. One worry is that cuts in social support and healthcare resulting from the UK’s austerity drive, allied to poor job prospects, could lead to “deaths of despair”, like those seen in white, middle-aged Americans. There are parallels with the US, says Stripe, but he thinks the jury’s out on whether austerity is to blame for the slowdown in the UK’s life expectancy. “All we can say is that the data corresponds to an interesting period politically and economically. But correlation is not causation,” he says. What's not in doubt is that the UK’s economy is stagnating. In 2017, its economic growth was the fifth lowest in Europe at just 1.7 per cent. We know that economic collapses elsewhere have shortened lives. The most well known occurred following the fall of the Soviet Union, which saw life expectancy for men plunge from 63.8 to 57.7 between 1990 and 1994. “Deteriorating health among working-age men isa type of canary in the coal mine for something going deeply wrong with our labour markets,” says David Stuckler at the University of Bocconi in Milan, Italy. GOLDEN OLDIES While the slowdown in life expectancy rises is recent, some of the factors responsible may have happened decades ago. One could be the dwindling of the so-called golden cohort: a group of people who were born in How much time do you have left? It all depends... the decade that followed 1925. For unclear reasons, they have long been experiencing higher rates of improvements in life expectancy than those born before and after. There were several beneficial changes in the 1920s that could have helped kick this off, such as improved nutrition, better sanitation and the advent of “Potentially, it’s areally big societal, cultural and economic change that we are seeing” vaccines for diphtheria and tetanus. But this doesn’t explain why rises in life expectancy slowed for those born later. One theory is that the golden cohort benefited from eating more fruit and vegetables in their childhood and adolescence because food rationing, which began in the second world war and was phased out in the 1950s, restricted access to unhealthier foods. Whatever the reasons, this group are now in their 80s and gos and their numbers are falling -—so they make less of a contribution to overall death rates. The health advantages of that group are beginning to fade from the overall figures, says Stripe. HEROIN HIKE Another possible reason for a slowdown in life expectancy improvements in under-55s could be escalating drug deaths. A National Health Service report published in February revealed that 2593 people died from drug misuse in England and Wales in 2016, 58 per cent more than in 2006 and the highest toll since records began in 1993. Deaths from drug misuse are now the third most common killer in 15 to 49-year-olds, it said. Increased availability and purity of heroin has been blamed for a doubling in heroin-related deaths between 2012 and 2016, with many of those dying aged 40 orabove, according to a report released by Public Health England in September. “People who became addicted to heroin in their teenage years and 20s back in the 1980s and 1990s are now older, less resilient and therefore more susceptible to overdosing,” says Johnathan Watkins of the PILAR Research Network, a think-tank in Cambridge, UK, that analyses public health issues. Austerity- related cutbacks in support systems for drug users may also have contributed, he says. OBESITY TIME BOMB Doctors have long been predicting that today’s children will be some of the first in history to have shorter lives than their parents thanks to the obesity epidemic. But it may be premature to assume that it is behind the recent slowdown in the rate of increase of our life expectancy. Most of the levelling off stems from changes to death rates in people who are in their 70s or older-where there hasn’t been so much of a rise in obesity in the UK. Changes to death rates in younger age groups are mainly due to other causes. In fact, it takes fairly severe obesity to have much of an effect on lifespan, and the impact declines as people get older. For instance, people in their 60s and 7os who are classed as obese lose just one extra year of life on average. “Being mildly overweight doesn’t cause a huge difference in mortality figures,” says Steven Grover of McGill University in Montreal, Canada. But David Ludwig of Harvard Medical School predicts that obesity will have more ofan effect on life expectancy over the next couple of decades. “The impacts are still flowing through the pipeline,” he says. & 25 August 2018 | NewScientist | 21"}, {"title": "Mind Matter", "author": "David Robson", "content": "“ UR minds aren't passive observers O simply observing reality as it is; our minds actually change reality. The reality we experience tomorrow is partly the product of the mindsets we hold today.” That's what Alia Crum told global movers and shakers at this year’s World Economic Forum in Davos, Switzerland. It may sound like New Age nonsense, but Crum, who heads the Mind & Body lab at Stanford University in California, can back up her claims with hard evidence showing the mysterious influence the mind has over our health and well-being. Crum’s pioneering research was inspired by her own experiences as a child gymnast and college ice hockey player. “You can be the same physical being from one day to the next,” she says, “but your mindset can have a dramatic effect on performance and physiological capabilities.” She often wondered why. Then, as a psychology student, she read about the placebo effect and had a eureka moment: if our expectations can influence the effectiveness of a drug, perhaps something similar can happen in other situations, too. Pursuing that idea, Crum and others have discovered that your mindset affects everything from your weight and fitness to the physical toll of insomnia and stress — even how well you age. The upshot is that two people could have identical genes and lifestyles but one can end up healthier than the other, thanks solely to their different thoughts. Placebos are inert pills used in most clinical drug trials. The participants are divided randomly into two groups: half take the drug being tested, the rest, for comparison, take an identical-looking sugar pill. With no active ingredient, the placebo shouldn’t have any effects. Yet it often brings about measurable changes, triggering the release of natural painkillers and lowering blood pressure, for example —all because of people’s expectations. Patients sometimes reap these benefits even when they know they are taking the placebo (see “Everyday placebos”, page 30). On the downside, our expectations of a pill can also produce side effects, including nausea and skin rashes. This is the placebo effect’s “evil” twin, the nocebo effect (see “The science of voodoo”, page 32). Crum was “blown away” when she learned how powerful these effects can be. “But what surprised me most was the fact that we’ve done relatively little to understand and harness them to improve health and well- being,” she says. Governments spend huge amounts of money encouraging us to adopt healthier lifestyles. What if our efforts could be boosted, or undermined, by the very psychological processes that influence a drug’s efficacy through the placebo and nocebo effects, Crum wondered. She has spent the past decade investigating that possibility. One of Crum’s first experiments examined the fitness of 84 hotel cleaners. She suspected that few of them would be aware of the sheer amount of exercise their job entails, and that this might prevent them from gaining the full benefits of that workout. To manipulate their mindsets, she gave half of them detailed information about the physicaldemandsof >» 25 August 2018 | NewScientist | 29 EVERYDAY PLACEBOS CAFFEINE: If astrong espresso sets your nerves jangling, that may be largely due to your expectations. Even pure water increased alertness and raised blood pressure in volunteers who were told it contained caffeine. As for those withdrawal symptoms when you can't get your morning cup of joe, they might be all in your head, too. SPORTS SUPPLEMENTS: There is little scientific backing for many of these products, but studies show that people only have to believe they are taking performance enhancers or energy drinks to show greater stamina and strength. Even the effects of steroids may be boosted by a placebo response. DESIGNER BRANDS: Are they really better than generics? Not necessarily. People tricked into thinking they were wearing designer sunglasses could more easily decipher small writing through the glare of bright light than those who thought they were wearing less prestigious brands. BOOZE: Drinking culture is full of urban myths, including the idea that adding Red Bull to vodka “gives you wings”. Studies reveal that the power of expectation is what really increases feelings of drunkenness. LUCKY CHARMS: They work because we believe they will. Golfers who thought they were using a professional's putter perceived the hole to be larger and easier to putt -and were more accurate as a result. 30 | NewScientist | 25 August 2018 Your their work— such as the fact that hoovering burns 200 calories an hour-and told them that their activity met the US surgeon general’s exercise recommendations. One month later, despite reporting no change to their diet or activity outside work, the cleaners who received the information had lost about a kilogram each, and their average blood pressure had dropped from elevated to normal. The others showed no difference. It was, admittedly, a small study and Crum didn’t record actual behaviour. “It could be that they were putting slightly more oomph into making the beds,” she says. However, a follow-up study with her colleague, Octavia Zahrt, bolstered the idea that people’s expectations directly influence their body’s response to exercise. That study used data from health surveys monitoring more than 60,000 people for up to 21 years. Zahrt found that the “perceived fitness” of the participants — how they felt compared with the average person —was a better predictor of their risk of mortality than the amount of time they said they spent exercising. Crucially, some of them wore accelerometers for part of the survey period — yet, after taking their actual physicial activity into account, the influence of their perceived fitness remained. Overall, people who took a more pessimistic view of their fitness were up to 71 per cent more likely to die during the survey, compared with those who thought they were more active than average — whatever their exercise routine. How this works is still a bit of a mystery. We do know that the brain can directly control blood pressure through the autonomic nervous system. In addition, Crum suspects that a poor perception of your fitness could be triggering inflammation and the release of hormones suchas cortisol, which might help determine how the body responds to exercise. Her team is investigating possible mechanisms but, she says, it’s not too early to take advantage of these effects. Crum’s advice, which she follows herself, is not to deceive yourself about your fitness, but to make sure that you don’t undervalue the exercise you do either. You should also avoid comparing yourself critically with your peers, particularly if they are exceptionally sporty. Fabrizio Benedetti at the University of Turin Medical School, Italy, who has pioneered work on the placebo and nocebo effects, praises the findings. “Crum’s work is very interesting and her approach to health is important from both a medical and psychological point of view,” says Benedetti. He stresses the need for caution, given the many variables that Go-To S$ influence everyday fitness, but argues that “we can learn a lot about the mechanisms, implications and applications” of the mind-body connection from such studies. Crum has now documented many other ways in which our mindset could be harming our health. A nocebo effect may undermine efforts to lose weight by dieting, for instance. In 2011, Crum offered volunteers a milkshake at her lab, then measured their levels of the “hunger hormone” ghrelin, which normally drops after a meal. Although everyone received the same shake, some were told it was healthy while others were led to believe “Understanding that stress needn't be damaging can help your body cope with it” they were having an indulgent treat. The impact was striking. Those who thought they had drunk a low-calorie shake showed markedly higher levels of ghrelin afterwards, which left them feeling less full. Ghrelin doesn’t affect appetite alone. By signalling food deprivation, the hormone also slows down metabolism, tipping the body towards storing fat rather than burning it. It makes evolutionary sense to reduce energy consumption when resources are scarce, but it is bad news when we are trying to lose weight. “When people think they are eating healthily, that’s associated with the sense of deprivation,” says Crum. “And that mindset matters in shaping our physiological response.” Instead, she suggests, dieters should cultivate a “mindset of indulgence”, savouring the textures and flavours of whatever they are eating. Non-dieters could be falling prey to this effect, too. When we drink a sugary beverage, our brain doesn’t seem to recognise the liquid as a source of energy, and fails to adjust digestion accordingly so that we tend to eat more afterwards than if we had eaten solid food containing the same number of calories. However, it is possible to subvert this effect by changing our expectations. Richard Mattes at Purdue University in Indiana primed people to believe that an energy drink would solidify once it reached their stomach. As well as lowering ghrelin levels, this increased their insulin response after consumption, and the drink stayed in their stomach longer - all of which left them feeling fuller. “That was followed by a decrease in the daily energy they consumed,” says Mattes. Crum has also been investigating the influence of our expectations on stress. It is well known that chronic stress can lead to reduced cognitive performance, high blood pressure and a compromised immune system. But can the fear of stress itself worsen its harmful effects? To find out, Crum first Fizzy drinks trick your brain, which is why they don't fill you up as much as solid foods You don'tneed to go to the gym toget the benefits of a workout MICHAEL [OEWA/LAIF/CAMERA PRESS assessed students’ attitudes by getting them to rate statements such as “experiencing stress depletes my health and vitality” and “experiencing stress enhances my performance and productivity”. Then she told them that they had to give a short presentation. Faced with this prospect, those who considered stress to be debilitating rather than enhancing showed the largest physiological reactions, including greater fluctuations in levels of the stress hormone cortisol. Such reactions are thought to underpin the most damaging health effects of stress. However, moderate stress responses can actually improve health, triggering the production of hormones necessary for cell growth, among other things. “There's a lot of public health messaging that warns us about the effects of stress, but it’s one-sided, and builds the mindset that stress is debilitating, when in fact there are many enhancing qualities,” says Crum. What's more, simply understanding that stress needn’t be damaging can help our bodies cope with it. After watching a video on the ways that stress can boost focus and creativity, Crum’s participants showed more optimal hormonal responses under stress, marked by moderate levels of cortisol and raised levels of growth- promoting hormones. Tired all the time? The dangers of stressing about stress might help explain some insomnia too. About a quarter of people's perceptions of how well they sleep don’t correlate with the sleep they actually get, with potentially significant repercussions. “Complaining good sleepers” — people who believe they are insomniacs, even though monitoring of their night-time brain activity suggests otherwise —are most likely to experience symptoms such as daytime fatigue, high blood pressure, depression and anxiety. “Non-complaining bad sleepers”, by contrast, are remarkably free of I'll effects. “Worry about poor sleep is a stronger pathogen than poor sleep,” says Kenneth Lichstein at the University of Alabama, who made this discovery. It is possible that constant daytime fatigue leads people to identify as insomniac, rather than insomnia causing the fatigue. But, at least one study supports the idea that a placebo effect is partly responsible. It found that simply priming participants to think they had slept poorly or unusually deeply influenced their cognitive functioning the next day. All these findings give us plenty of reasons to reassess our mindsets. But perhaps the most provocative research concerns ageing — with some strong evidence that negative beliefs could knock decades off your life. The first clues emerged in the early 1980s. Ellen Langer at Harvard University - who later collaborated with Crum on the hotel 'SIMOXIE PRODUCTIONS, cleaner study - took a group of pensioners § to a monastery in New Hampshire and told 5 them toactas if they were 22 years younger 2 forthe duration of their stay. The retreat was 5 decorated as if the year were 1959, and filled & with music, films, magazines and books from 2 that era. Their rooms contained no mirrors, > 25 August 2018 | NewScientist | 31"}, {"title": "The Science of Voodoo", "author": "Unknown", "content": "THE SCIENCE OF VOODOO When anthropologists first heard reports of witch doctors killing people with a curse, they looked for rational explanations. These were undermined, however, by the discovery that Western doctors have similar powers. In the 1970s, for example, a man died just months after doctors told him he had end-stage liver cancer - despite the autopsy revealing that the diagnosis had been mistaken. He hadn't died from cancer but from believing he had cancer. We now know what lies behind these strange goings-on: the nocebo effect. The “evil” twin of the placebo effect, it is when putting someone in anegative frame of mind has adverse consequences for their health or well-being. Tell people that a medical procedure will be extremely painful, for example, and they will experience more pain than they would otherwise. Similarly, warning about the possible side effects of a drug makes it more likely that patients will report experiencing those effects. The nocebo effect is widespread: about a quarter of participants in clinical trials experience side effects even though they have been givena placebo, a sugar pill. Recent research indicates that it can be even stronger than the placebo effect, particularly when people are anxious or feel that their doctor doesn’t understand or believe them. And the nocebo effect is not just a problem in healthcare. Itcould also be undermining your efforts to lose weight, shape up, cope with stress, and more (see main story). 32 | NewScientist | 25 August 2018 Apositive attitude to ageing will keep you healthier and more active for longer only pictures of their younger selves. After just five days, the pensioners’ arthritis had improved, their posture was more upright, and their thinking —- as measured by anIQ test — was sharper. Inspired by this study, other teams have since shown that our attitudes really can influence how our bodies fare over time. Overall, people who view ageing positively live 7.5 years longer than those who associate it with frailty and senility. Negative perceptions of ageing are not merely the result of poor health; they can foreshadow symptoms by as much as 38 years. Admittedly, people with a pessimistic = 2 2 z : z 5 2 z assimilated the age stereotypes of their culture,” says Levy. But her latest studies suggest that attitudes can be changed. Inone, participants aged between 61 and 99 played a computer game while positive age-related words such as “wise”, “mature” and “experienced” flashed briefly on the screen. Although they did not consciously register the words, their perceptions of ageing had significantly improved after four sessions, as had their physical well-being. Amazingly, the benefits, including increased mobility, surpassed those from a six-month physical exercise regime. No wonder some researchers are calling for campaigns that educate people about the dangers of ageism. “Being aware of these view of ageing are less active and lesslikelyto “t's about being empowered seek healthcare when they need it. However, many studies find this cannot fully explain the effect on health. So, what’s going on? It seems that people with rosier beliefs about ageing react less to stress and are less likely to develop inflammation —both of which would mean that they age more slowly. Becca Levy at the Yale School of Public Health has found that they tend to have longer telomeres — the protective caps at the ends of chromosomes. This matters because telomeres wear away with time, so area yardstick of age. Such people are also less likely to develop brain changes associated with Alzheimer’s disease than those who view ageing negatively. Ageism is deeply engrained. “We know that children as young as 3 or 4 have already by the possibility that we can choose better mindsets ” stereotypes, and questioning them, and developing a resistance to them - that’s a good skill people can learn at any age,” says Levy. Of course, a positive mindset is nota panacea. But these findings could help us all benefit more from our efforts to achieve a healthy lifestyle through exercise, a balanced diet, relaxation and getting a good night's sleep. “It's about being mindful of the fact that we have mindsets and that they matter, and being empowered by the possibility that we can choose more useful mindsets,” says Crum. @ David Robson is a freelance journalist in London"}, {"title": "The truth about your memory", "author": "Unknown", "content": "HEN considering what makes us who we are, it is easy to think our memories are the answer. Aside from the physical traces of the passing of time on your body, your recollections are perhaps the only thing that links the you sitting here today to the many yous from every previous day of your existence. Without them, your relationships would mean nothing, not tomention your knowledge, tastes, and your many adventures. It might be no exaggeration to say your memories are the essence of you. With this in mind, it is not surprising that much of the burgeoning field of neuroscience has turned its efforts to understanding what makes a memory and how to keep hold of it. Perhaps the most intriguing idea tocome from recent discoveries is a reimagining of the dark side of memory — forgetting. As cherished memories fade or when we fail to remember an important task it is easy to feel that memory is failing us. But what the latest findings show is that simply thinking of memory as either accurate or fallible is a mistake. Instead, our memories are malleable, and for good reason. Rather than existing in the filing cabinet of the brain, we conjure memories from scratch with our own style (see page 41). As we sleep, the brain meticulously crafts them into the most useful versions (see page 34). Technology too, affects how we remember and might even create whole new recollections (see page 38). As for forgetting, as infuriating as it can be, we'd be lost without it. Because memory, it turns out, is an illusion—-one we create every time we recall the past and that is exquisitely designed to help you live your life. THORDIS RUGGEBERG/PLAINPICTURE e TFIRST, it seems obvious. j\\ Memory is about the past. it is your personal database of things you have experienced. In fact, this repository has a purpose that goes way beyond merely recalling information. Some of the best evidence of this came from studies of people with brain damage or amnesia. One iconic case was of a patient known as KCin the early 1980s. After a motorcycle accident, he was left with animpaired episodic memory: he could remember facts, but not personal experiences. The weird thing was, italso stopped him doing something else entirely. “By studying patients who have an impaired ability to recall the past, we find that they memory for? 32 | NewScientist | 27 October 2018 are also impaired at imagining the future,” says Eleanor Maguire at University College London. We now know there is a strong link between being able to remember past events and being able to plan for the future. Imaging studies, for example, show that similar patterns of brain activity underlie both. The key seems to be the ability to generate images of scenesin the mind's eye. “If you think about it, recalling the past, imagining the future, and even spatial navigation, typically involve us constructing scene imagery,” says Maguire. It could be that being able to picture the past enabled us to imagine the future, and therefore plan - one of the complex cognitive feats that stands humans apart from many other species. If we can't recall past events and preferences, our ability to make sound decisions crumbles too. This is because during the decision-making process, the brain uses previous choices and existing knowledge to assess options and imagine how they might turn out. The latest thinking is that memory could even have evolved to enable our species to communicate. Earlier this year, cognitive scientists Johannes Mahr and Gergely Csibra at the Central European University in Budapest, Hungary, suggested that the key difference between human memory and that of other animals is that we don't just recall an event, we also remember how we came to know"}, {"title": "Why can't I remember what I did 5 seconds ago?", "author": "Unknown", "content": "WHY can't | REMEMBER WHAT | DID 5 SECONDS AGO? Hang, on - you just left the house, but did you lock the door? When it comes to these habitual behaviours, your body knows what to do without the need for conscious thought. The brain no longer encodes the details of a repeated behaviour, so while you remember how to lock the door, there's no specific memory of when you last did it. This ability to autopilot can be beneficial, freeing up attention for more important things. The danger comes when this “habit memory” takes over when it isn't supposed to, which can lead to mistakes like forgetting to drop a child off and leaving them in the car instead. Yvaine Ye about it. “This is different from just knowing about it,” says Mahr. “Having first-hand experience of something gives us authority, makes us more convincing and accurate.” Sending signals that are convincing is a vital part of managing our social relationships and belief systems, he argues. Without this, we would be unable to justify social entitlements and obligations, such as promises, whichis often possible only by explicit reference to past events. Whether memory led to complex communication or vice versa is not yet known, but what is clear is that far from being a mere databank of the past, memory is essential for our present and future. Now that’s worth remembering. Alison George Can | supercharge my memory? UPERHUMAN memory has a special appeal. iN Who could resist the idea of remembering everything they wanted to, without trying? Learning would be made easy, examsa breeze and you would never forget where you left your keys. Oh and memory-related disorders like Alzheimer’s would have met their match. So it is of little surprise that scientists have turned their attention to ways of enhancing human memory using techniques that stimulate, supplement or even mimic parts of the brain. The immediate goal is to treat memory disorders, but the idea of a memory prosthesis for everyday life is gaining ground. “We're at the point now where on the one hand it’s very exciting, but on the other it’s controversial because we are not only treating disorders, we're trying to enhance mental functions,” says Michal Kucewicz at the Mayo Clinic in Minnesota. One approach is deep brain stimulation (DBS), which involves zapping an affected brain area with animplanted electrode. This is already used in the treatment of Parkinson's disease and epilepsy, among other conditions. Implanting electrodes in brain regions responsible for memory, such as the hippocampus, seems to offer a short-term memory boost too. And small studies have even suggested that DBS might reverse some of the damage seen in certain people with Alzheimer’s disease, halting the shrinking of the hippocampus and potentially encouraging it to grow bigger. DBS is still a blunt tool, however. A more- advanced approach is to artificially recreate the same electrical activity in the brain that happens when memories form. One such “memory prosthesis” has already been shown to work in people with memory problems resulting from epilepsy. The researchers involved taught an algorithm to learn the pattern of brain activity that occurs when memories go into long-term storage using data they collected from the patients’ brains as they were learning. They then used implanted electrodes to simulate this activity, causing memories to be stored in the brain. The implant boosted memory performance by 3 2 a § 30 per cent. A similar technique might even be used to implant memories directly, which could also help those with Alzheimer’s disease. Techniques like these involve invasive surgery, so have been reserved for people with neurological disorders for whom the benefits might outweigh the risks. But many of those behind the research envision a time when any of us could be walking around with implants quietly boosting our brain function. The projects are backed by big names and big money. The US Defense Advanced Research Projects Agency has been supporting the epilepsy memory prosthesis project since “It'S controversial because as well as treat disorders, we are trying {0 enhance mental functions” 2013, as part of its Restoring Active Memory programme, which seeks to help improve memory in the injured brain. In 2016, entrepreneur Bryan Johnson invested $100 million in his company Kernel, which seeks to develop brain implants to boost intelligence. The company started by focusing on memory. Since then, Elon Musk has joined the action. The engineer and investor, who heads Tesla and SpaceX, has co-founded a venture called Neuralink. He wants his brain-machine interfaces to merge aspects of human and machine intelligence. One goal is to outsource the hard work of memory-making, whether to combat disease or put an end to worries about where we left the keys. Jessica Hamzelou 27 October 2018 | NewScientist | 33"}, {"title": "What happens to your memories when you sleep?", "author": "Unknown", "content": "What happens to your memories when you sleep? revision notes under your pillow the night before an exam will make you remember more. That might be stretching the truth, but there could be something in it—you really do learn in your sleep. You don’t need sleep to create a memory. “But sleep plays a critical role in determining what happens to these newly formed memories,” says Bob Stickgold at Harvard Medical School. Sleep determines what goes into long-term storage. It can also select which | HERE is an old wives’ tale that putting your 34 | NewScientist | 27 October 2018 E 3 2 H E y parts of amemory to retain. And it links new memories with established networks of remembrances. It discovers patterns and tules, says Stickgold, “and it’s doing this every night, all night long.” One of the biggest unanswered questions is how the sleeping brain knows which memories to strengthen, and which to ignore. “We don’t know either the algorithms the brain uses to make these decisions, or how they are implemented,” says Stickgold. What we do know is that sleep is special. “During slow-wave sleep, there is this release, akind of beautiful set of interactions between different brain areas, that is specialised, and it looks different than what we see during awake periods,” says Anna Schapiro, also at Harvard Medical School. There is conversation between regions key to memory, including the hippocampus, where recent memories are stored, and the cortex, where long-term memories end up. This chatter might be allowing the cortex to pull out and save important information from new memories. We don’t need to recall everything that happened in a day, and sleep favours certain types of memory. It homes in on information that might be useful at a later date, and puts it into longer-term storage. Schapiro has found, for example, that merely telling people they will be tested on certain material helps them remember more of it after sleep. Memories with an emotional component also get preferential treatment —especially “Sleep will help to preserve a really intense memory, but decrease the emotionality” negative emotions. That makes sense from an evolutionary perspective if we are to remember our mistakes and so increase our chances of survival. However, there are also hints that sleep might help to modulate emotional memories. “If you have a memory that was really intense, sleep will help to preserve the memory, but decrease the emotionality,” says Schapiro. This could be crucial for our mental health. “Post traumatic stress disorder might actually be a direct consequence of failures of those sleep-dependent processes that weaken the intensity of emotional responses to memories,” says Stickgold. It could also help explain why getting too little sleep is so bad for you. Negative memories become dominant over neutral and positive ones, for a start. We end up less wise too, says Stickgold. “We remember facts and events, but don’t manage to figure out what they really mean for us and our future.” And what about advice for anyone with exams on the horizon? “It’s much better to go to sleep between studying and taking a test than to stay awake all night studying,” says Schapiro. So put those notes under your pillow and get some shut-eye. Your brain should do the rest. Catherine de Lange"}, {"title": "Why can't we remember being babies?", "author": "Unknown", "content": "WHY CAN'T WE REMEMBER BEING BABIES? Infants are constantly learning, but only ahandful of people have memories from before the age of 2. That's because parts of the brain critical for longer-term memory are still immature. So babies can form memories - a 6-month-old can recall how to do certain tasks for up to three weeks - but holding onto them is tricky. As the brain begins to mature, that neural machinery gets more efficient and memories start to stick - until the age of 7, when there's a sudden dip. Children recall far more about earlier events in their lives when asked before they are 7 than just ayear later. This sudden erasure, known as “childhood amnesia” may be down to pruning, the brain's process of snipping away lesser-used connections to strengthen those that remain. Although the slightly older children remember fewer things, their recollections are more detailed. “What's also developing is your ability to tell a good story,’ says Patricia Bauer at Emory University in Atlanta, Georgia. “You place it in context, you tell me what you did, highlight certain events and activity. All of those things are part of what we mean by autobiographical memory.” This points to a possible strategy for hanging onto more of those early memories, or at least attempting to influence which ones stick. In cultures where family storytelling is a cherished pastime, people are more likely to retain early childhood memories. Summoning and reviewing these memories, a process known as reconsolidation, can fortify them. So if you want your child to remember a special trip to the beach, indulge in alittle reminiscing, and get them to tell you the story. Tiffany O'Callaghan Can you choose what to forget? EALL have memories we would rather forget - and it is possible, if you try hard enough. it is easy to think of memories as something you can actively strengthen, whereas forgetting is a passive process. But we have started to discover it can be intentional too. Perhaps the easiest way to forget something is simply to try to suppress a memory. Jeremy Manning at Dartmouth College, New Hampshire, has found that just telling people to “push thoughts out of their head” is enough to make them forget lists of words they have learned to associate with particular cues. “We don't know how, but people seem to know how to doit.” This seems especially paradoxical because we also know that rehearsing memories helps to strengthen them. Suppression has been linked to decreased activity in the hippocampus, so we may be unknowingly reducing our hippocampal activity by focusing on the present, says Justin Hulbert at Bard College, New York. This won't work for everyone. Post- traumatic stress disorder (PTSD) involves intrusive memories that keep coming back - often suddenly and unexpectedly. Studies have found that people with this condition are less able to suppress memories, even those unrelated to traumatic incidents. But other approaches for forgetting might help, including what are known as cognitive vaccines: interventions that can “inoculate” the brain against the onset of PTSD symptoms if administered soon after trauma. Some computer games seem to do the trick. Playing Tetris after watching an upsetting film has been found to reduce flashbacks of that film, possibly because thinking abouta visual task stopped the brain from processing the visual images of death and injury from the film. However, doing anon-visual task, such as playing ageneral knowledge game, actually increases flashbacks. TARA MOORE/GETTY Given the vital role of sleep in memory formation (see “What happens to your memories when you sleep?”, page 34), this is also aprime time to intercept them. Earlier this year, Katharine Simon at the University of Arizona and her colleagues found that they could train people to associate a particular sound with the instruction to forget something. They then taught the volunteers to associate other sounds with specific words. Then, as the volunteers slept, the team reactivated the memories of some of these words using their associated sounds, while also playing the “forget” sound. A week later, the volunteers were worse at remembering these words than words that hadn't been targeted. Being able to exert some control over what you remember probably helps to bolster your resilience in the face of adversity, says Hulbert. Beware the downsides, however. Hulbert’s team found that when you try to suppress a memory, you are later less likely to remember things that happened around the time you attempted suppression. It seems that quietening your hippocampus to block a memory causes an “amnesic shadow’ that more generally impairs memory formation. And good can come from holding on to even the most awkward of memories, Hulbert says. “For sure, bringing one to mind can be cringe-inducing, butit’s important to reflect on the good that certain embarrassing memories can bring, as learning experiences that teach us what not to do again.” Penny Sarchet 27 October 2018 | NewScientist | 35"}, {"title": "How to improve your memory", "author": "Unknown", "content": "Get active Exercising after learning will help facts stick. For best results, wait several hours before working out. Quiz yourself When it comes to revision, reviewing the material isn't enough. You need to test yourself repeatedly too. Take a break You'll remember more if you take regular breathers from learning. For best results, do something totally different and absorbing. Timing matters Teenagers remember better if they learn in the afternoon or evening, while older adults tend to have morning brains. Try interval training There's a “sweet spot” for when you should revise. Revisit material at a point 10 or 20 per cent of the way between the time of learning and of taking a test to improve your memory by at least 10 per cent. Sleep an it Snoozing shortly after learning new facts or skills helps the brain reinforce its memory traces - especially if you have a test the next day. Chew gum Itcan help with recall during a test. However, the effects are short-lived, so save your chewing for when you need it most. Kate Douglas 36 | NewScientist | 27 October 2018 Can | trust my memories? Psychologist Elizabeth Loftus exposed false memories in historic sex abuse cases. Now there are fresh reasons not to believe your own memories, she tells Clare Wilson toexpose the fallibility of human memory. In the 1990s, amid growing panic over claims of satanic child sex abuse rings, the psychologist showed how easy it is for people to develop false memories of events that never happened. All it took was repeatedly being asked to imagine them. At the time, this was a common psychotherapy technique to recover supposedly repressed memories. Over the past three decades, Loftus, from the University of California, Irvine, has become well known for her work as an expert witness in legal cases. Her ongoing research on the fallibility of eyewitness testimony has taken on fresh importance in an era of fake news, the Me Too movement and digital image manipulation. l OONE has done more than Elizabeth Loftus Why did you first start looking into false memories? Thad already been looking at how reliable eyewitness testimony was, to see if people’s memories of the details of an event could be distorted. Like if the guy running away had curly hair, not straight hair. But int he 1990s, when there was an explosion of highly improbable satanic child abuse claims, it looked like people were developing whole memories for things that didn’t happen. We came up with the idea of trying to make people remember an event that never happened — being lost in a shopping mall when they were young. How did you do it? We told people we were doing studies of childhood memory, and we talked to their parents to get some stories. Then we would interview adults and present them with three true events from their childhood, and a completely made-up experience about how they got lost in a shopping mall. frightened. crying, and were ultimately rescued by an elderly person and reunited with the family. After they'd had about three interviews, we found that about a quarter of these adults fell prey to the suggestion and developed a partial orcomplete memory of being lost. Why was that discovery important? Atthetime, people were going into therapy with depression or an eating disorder and coming out with an even bigger problem, namely memories of traumatic experiences that they thought they had repressed. Their therapists weren’t deliberately planting false memories. They believed that child abuse was the most likely explanation for their client’s problems, and they needed to recover the memory to get better. Innocent people were getting accused and families were being destroyed. What was the reaction? I started getting hate mail and death threats. There was a letter-writing campaign to try to get me fired from my university position. Ialso got sued for exposing an egregious case of wrongful accusation. I spent many years fighting off that litigation. These days things have calmed down quite a bit but there’s still some hostility. The Me Too movement has led to a surge in historic claims of sexual assaults. Do you think some of these could be based on false memories? It is possible. We have to accept that when there are two people whose versions of an"}, {"title": "How reliable is eyewitness testimony?", "author": "Unknown", "content": "event are different, the man’s version may not be the truth or, alternatively, maybe the woman's version is not the truth. We have to look for other sources of evidence to corroborate either person. But right now, at the height of “Me Too”, people are not as interested in hearing you talk about false accusations as they might have beena year ago. The pendulum has swung too far in the direction of automatically believing the accuser. It used to be too far the other way. But we know most abuse cases are not successfully brought to trial... Iabsolutely see what you're saying. But as an expert witness on memory, | see a different subset of cases to the ones that most people see. I see the most contentious ones. I hate the idea that people will try to point to all the false memory work and use it to deny guilt when they’re truly guilty. I think that probably sometimes happens and it’s just going to bea cost. 1 don’t know what we can do to stop that. 2 = HH & 5 3 3 & What other memory problems has your research shed light on? We have been doing some work on a phenomenon called memory blindness. Say that someone is being interviewed after witnessing a crime. They tell you that person was wearing a green jacket. Later on you tell them they told you the jacket was brown. We are exploring the extent to which people even notice you fed back a different answer from the one they actually gave. Often they don’t. We think this can be a problem in cases where the police are writing out a statement. They say “Here's what you told me.” What if there are errors contained in it? It can happen. We are showing that people can fail to detect them and be influenced by them. Can we misremember our feelings as well as facts? The evidence would suggest so. Another study we are doing is we take you through a difficult task and ask you to rate your anxiety. I tell you that you rated it at 40 when really you rated it at Go. People often don’t detect you gave them the wrong rating and they start to feel less anxious about the task. When they look back, it was less awful for them. You could do this with kids when they go to the dentist. A former student of mine did some research with kids at a dental clinic, and she got them to remember less fear and pain, and they also behaved better at the next visit. So there could be benefits to fallible memories? If your kid has hada traumatic but minor experience,ratherthandwellingonthenegatives, it might be better instead to talk them up. To say: “People remember voting in elections they didn't vote in. Itmakes them feel better” “You were so brave, you hardly cried.” It is generally a little easier to plant a positive memory than a negative one. We don’t know why, it just empirically seems to be the case. Is there any evolutionary reason why memory is so unreliable? One benefit is that when errors creep in, you can fix them and update memories with true information. Another is that some errors can make you feel better about yourself. These are called prestige-enhancing memory distortions. Acommon example is people remember voting in elections they didn’t vote in, because they like to think of themselves as civic-minded. Sometimes it gets people into trouble, like in “stolen valour cases”, when someone famous says they were a brave soldier on the battlefield and it turns out they were really behind a desk on that day. So most of the time it is a harmless delusion? If these kinds of prestige-enhancing distortions aren’t caught, it does allow people to feel better about themselves. People with depression don’t have them as much as everyone else. Such people are sadder but wiser. This is just a correlation, so we don’t know if the lack of prestige-enhancing memory distortions is causing the depression. But it does suggest another possible upside to the unreliability of our memories. If there are costs, there have got to be some benefits. & Clare Wilson is medical news reporter at New Scientist 27 October 2018 | NewScientist | 37"}, {"title": "Is my memory normal?", "author": "Unknown", "content": "Is my memory normal? Why do some people remember what they did years ago, whereas others have no clue, but never forget a face or are masters of the trivia quiz? 38 | NewScientist | 27 October 2018 I know that | went out for dinner last month, but I can’t remember anything about the experience How much we remember of events we have experienced seems to fall on a spectrum. At one extreme, some individuals are unable to form these kinds of memories at all. “People with severely deficient autobiographical memory syndrome would report an awareness of the fact they were at the dinner, but they don't have a feeling of re-experiencing it. It's more of a factual memory,’ says neuropsychologist Brian Levine of the Rotman Research Institute in Toronto. At the opposite end of the spectrum are those with “higher superior autobiographical memories”, who can = 3 8 z 8 Hy 2 & 5 & g Is technology making my memory worse? S AN ostrich’s eye bigger than its brain? This kind of trivia question was once a cognitive workout, but when was the last time you really pondered a question, rather than simply turning to the internet for help? Then there are phone numbers and friends’ birthdays: information we once stored in our brain is now held in the smartphone in the palm of our hand. Outsourcing memories, for instance to pad and paper, is nothing new, but it has become easier than ever to do so using external devices, leading some to wonder whether our memories are suffering as a result. Probably the largest data dump is of snapshots of events, whether it is thousands of photos posted on social media or status updates documenting our lives. You might think that taking pictures and sharing stories helps you to preserve memories of events, but the opposite is true. When Diana Tamir at Princeton University and her colleagues sent people out on tours, those encouraged to take pictures actually had recall in precise detail events from decades ago. The best-known case is that of a woman called Jill Price, who can recall most days of her life from the age of 11. The majority of us fall somewhere in between. Strong autobiographical memory skills are linked to the ability to form vivid visual memories of experiences, and probably to a strong sense of your own self-awareness. Random memories pop spontaneously into my mindall the time Known as “mind pops’, these involuntary recalls happen to all of us, on average about 20 times a day, although there is a lot of variation between individuals. “It’s a basic “Creating a hard copy of memories in media leaves a diminished Cony in our own heads”"}, {"title": "Does technology affect our memory?", "author": "Unknown", "content": "a poorer memory of the tour at a later date. “Creating a hard copy of an experience through media leaves only a diminished copy in our own heads,” she says. People who rely on a satellite navigation system to get around are also worse at working out where they have been than those who use maps. The mere expectation of information being at our fingertips seems to have an effect. When we think something can be accessed later, regardless of whether we will be tested on it, we have lower rates of recall of the information itself and enhanced recall instead for where to access it. “These kinds of studies suggest that technology is changing our memories,” says Sam Gilbert at University College London. “We increasingly don’t need to remember content, but instead, where to find it.” Insome instances, this could be useful. When people were given two lists of words and asked to memorise them each in 20 seconds, those who were allowed to save the first list on acomputer rather than deleting it before moving on to the next, could remember more information from the second list at a later date. It seemed as if cognitive offloading freed up vital brain resources that allowed them to better memorise new information. But relying too heavily on devices can mess with our appreciation of how good our memory actually is. We are constantly making judgements about whether something is worth storing in mind. Will Iremember this tomorrow? Does it need to be written down? Should I set a reminder? This is called meta- memory, and technology seems to screw it up. For instance, people who can access the internet to help them answer general knowledge questions, such as “How does a zip work?”, overestimate how much information they think they have remembered, as well as their knowledge of unrelated topics after the test, compared with people who answered the questions without going online. You lose touch with what came from you and what came from the machine. “These are subtle biases that may not matter too much if you continue to have access to external resources,” says Gilbert. “But if those resources disappear— inan exam, inan emergency, in a technological catastrophe — we may underestimate how much we would struggle without them. Having accurate insight into how good your memory actually is, is just as important as having a good memory in the first place.” For now, technology seems to be tweaking rather than upending our capacity for memory, but if the interface between us and devices merges more in the future, “the brain will really begin to adapt in ways we can’t anticipate right now’, says Martin Conway, director of the Centre for Memory and Law at City, University of London (see “Can supercharge my memory?”, page 33). So if you are ever again asked about an ostrich brain, try the encyclopaedia in your head before reaching for your phone. Just remember, the answer is yes. Helen Thomson characteristic of autobiographical memory,” says Dorthe Berntsen of Aarhus University in Denmark, who studies this phenomenon. Once they pop into your head, they soon disappear. \"They're like dreams - if you don't write them down, you forget all about them,” Berntsen says. We tend to experience more of these spontaneous memories as we age and retrieve fewer memories consciously, perhaps because we find it harder to inhibit thoughts as we get older. Berntsen’s work shows that they tend not to spring up when we are focused on a task, but are more likely to appear in dull moments. She thinks that, far from being an unwanted distraction, they are an important component of daily functioning. These involuntary memories are often associated with the environment we are in, and there isa high probability they have relevance to the ongoing situation, she says. “They can give you an update, reminding you that last time you were in this situation you did this or that,” she says. But they are also cheap. “They don't require the parts of the brain that require effort - executive functioning. If they are not relevant, you don't have to think about them,” Berntsen says. I can remember facts, but am rubbish at faces You might come across as rude if you don't remember people, but don't beat yourself up about it, everybody's memory is different. This could be down to innate differences in brain wiring. People with prosopagnosia, or face blindness, for example, can't easily tell faces apart, even if they belong to people they know well. At the other end of the spectrum are super-recognisers, who have an amazing memory for faces. For the rest of us, our memory skills (or lack thereof) are more likely to be due to our life experiences and strategies we've picked up along the way. Most of us start out with roughly the same memory ability, but “subtle differences at the beginning get amplified by experiences and interests that build on each other. It’s not intrinsic, it's acquired,” says neurologist Barry Gordon at Johns Hopkins University WHY DOES BEING STRESSED AFFECT YOUR MEMORY? Emotion and memory go hand in hand. We secrete stress hormones, such as cortisol and adrenaline, when we are emotionally aroused, whether the result of a trauma or a fantastic concert. These hormones trigger the firing of signals in the brain, which promotes memory formation. The flip side is that when it comes to retrieving memories, stress can hamper our efforts. It can also prevent us from updating existing memories with new information. Which explains why, despite our best efforts, it is all too easy for the mind to go blank in the stressful setting of a presentation or the exam hall. YY in Baltimore, Maryland. Expertise, prior knowledge and practice make a big difference to what we remember. Tests of chess masters, for example, show that they have a superior memory for patterns of pieces on a chessboard, but only for ones that are plausibly found in the game. Their ability to remember random positions is little better than that of novices. And studies on master memorisers who, for instance, can remember thousands of digits of the number pi, shaw that their superior powers of recall are due to strategies to “chunk’ information into meaningful groups, not any innate talent for remembering. “They still need sticky notes on the fridge door to remember their shopping list,” says Gordon. Alison George 27 October 2018 | NewScientist | 39"}, {"title": "What happens to memories over time?", "author": "Unknown", "content": "What happens to memories over time? too well. “All things being equal, it's harder to remember things from a long time ago compared to more recent events,” says neuroscientist Marc Howard of Boston University. But forgetting doesn’t just happen by accident. Evidence suggests that it is largely down to active processes in the brain. Inthe hippocampus, for instance,
