<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reading Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        .reading-card {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .reading-content {
            font-size: 18px;
            line-height: 1.8;
            color: #e5e5e5;
        }

        .reading-content p {
            margin-bottom: 1.2em;
            margin-top: 0;
        }

        .progress-bar {
            height: 3px;
            background: #262626;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .btn-nav {
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            outline: none;
        }

        .btn-nav:active {
            transform: scale(0.96);
            opacity: 0.85;
        }

        .btn-nav:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-left {
            animation: slideLeft 0.3s ease;
        }

        .slide-right {
            animation: slideRight 0.3s ease;
        }

        @keyframes slideLeft {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .title-gradient {
            background: linear-gradient(135deg, #fff 0%, #a3a3a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .reading-scroll {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        .glass-bar {
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>

                    Next
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>

    <script>
        const readings = [{"title": "Can green tea affect Down's traits?", "author": "Alice Klein", "content": "PEOPLE with Down’s syndrome who take a green tea extract from infancy are less likely to develop the facial features of the condition. But researchers have warned that parents shouldn’t give these supplements untila safe dose has been determined. Down's syndrome arises from having all or part ofanextra chromosome, which can lead to a range of characteristics, including intellectual disability and facial differences. Some of these characteristics seem to be partly due to having too much ofan enzyme called DYRK1A. Mara Dierssen at the Centre for Genomic Regulation in Spain and her colleagues have been investigating the effects of a compound in green tea called epigallocatechin-3-gallate (EGCG), which is known to inhibit DYRK1A. EGCG isn’t an approved treatment yet, but some parents have already started giving it as a dietary supplement to children with Down’s syndrome, prompted by studies that suggest it may have some cognitive benefits. The researchers recruited 13 such children, and compared their facial dimensions with children with Down’s syndrome who weren't taking EGCG, as well as children without the condition. EGCG appeared to have little effect when children started taking it after the age of 3. But six of the seven children who began taking it before they turned 3 had facial dimensions that matched or closely resembled those of children without the condition (BioRxiv, doi.org/cmnq). The team had previously found that young adults with Down’s syndrome who took EGCG for a year performed slightly better in tests of memory and reasoning. The EGCG dose was equivalent to drinking eight cups of green tea per day. Experiments in a mouse model of Down’s syndrome have shown that early EGCG treatment does seem to change face, skull and limb bone development. Minimising facial variation may reduce stigma towards people with Down’s syndrome, says Linda Gilmore at the Queensland University of Technology in Australia. But there are ethical questions about whether we should try to “normalise” people a z FE who look different, she says. Families have different attitudes to raising children with Down’s syndrome, says Gilmore. “Some are keen to try anything that might make things easier cognitively and socially, even treatments that have not been established scientifically,” she says. “Others feel strongly about not changing the person they are.” The study was small, and can’t provide clear conclusions as the children took supplements for different amounts of time. But Jean Maurice Delabar at the Brain and Spine Institute in Paris says the findings warrant larger-scale studies in young children. However it is important to determine the optimum dose, he says, because mouse studies suggest that very high amounts of EGCG can cause severe facial and skeletal abnormalities. Delabar advises parents not to give EGCG to their children until more research has been done. “Non-prescribed use of this compound — even if found in green tea-is risky at this stage.” Helen Leonard at the Telethon Kids Institute in Australia agrees, but says it can be hard for families to wait for the outcomes of long- running clinical trials. “That means the earlier this research can be done, the better.” The brightest mystery burst from space THREE new fast radio bursts (FRBs) have been seen flashing from space, and one is the brightest ever spotted. FRBs are some of the most difficult to spot phenomena in the universe. These powerful blasts of radio waves flash from far off for just a few milliseconds and then disappear - and we have no idea what causes them. Because they are fleeting, we had only detected 33. Now, three more have been seen in just 11 days. The first was spotted on 1 March by the Breakthrough Listen project. The second and third were seen on 9 and 11 March by a team led by Stefan Oslowski at Swinburne University of Technology in Melbourne, Australia. The findings were reported on The Astronomer’s Telegram, a website where astronomers post sightings of short-lived cosmic events. “Finding three this quickly is quite unusual,” says Peter Williams at the Harvard- Smithsonian Center for Astrophysics. “It seems like it was just luck.” “The burst on 9 March was by far the brightest one we've seen,” says Maura McLaughlin at West Virginia University. According to the FRB Catalogue, alist of FRBs and their properties, it is about 4.5 times as bright as the next brightest. Only one FRB has been seen flashing more than once. Some researchers have hypothesised “If all fast radio bursts repeat, we should be able to detect more pulses from this very bright one” that all FRBs repeat, but some of the bursts are too dim for us to see. If that is the case, then the 9 March burstis particularly promising. “If we believe that all FRBs repeat and it's just a matter of waiting long enough for one to be bright enough, we should be able to detect more pulses from this one because it's so bright.” says McLaughlin. We have been able to make more detailed observations of the repeating FRB than any others by virtue of its multiple blasts. A second repeater might help us figure out what FRBs really are. Leah Crane @"}, {"title": "The brightest mystery burst from space", "author": "Unknown", "content": "from space THREE new fast radio bursts (FRBs) have been seen flashing from space, and one is the brightest ever spotted. FRBs are some of the most difficult to spot phenomena in the universe. These powerful blasts of radio waves flash from far off for just a few milliseconds and then disappear - and we have no idea what causes them. Because they are fleeting, we had only detected 33. Now, three more have been seen in just 11 days. The first was spotted on 1 March by the Breakthrough Listen project. The second and third were seen on 9 and 11 March by a team led by Stefan Oslowski at Swinburne University of Technology in Melbourne, Australia. The findings were reported on The Astronomer’s Telegram, a website where astronomers post sightings of short-lived cosmic events. “Finding three this quickly is quite unusual,” says Peter Williams at the Harvard- Smithsonian Center for Astrophysics. “It seems like it was just luck.” “The burst on 9 March was by far the brightest one we've seen,” says Maura McLaughlin at West Virginia University. According to the FRB Catalogue, alist of FRBs and their properties, it is about 4.5 times as bright as the next brightest. Only one FRB has been seen flashing more than once. Some researchers have hypothesised “If all fast radio bursts repeat, we should be able to detect more pulses from this very bright one” that all FRBs repeat, but some of the bursts are too dim for us to see. If that is the case, then the 9 March burstis particularly promising. “If we believe that all FRBs repeat and it's just a matter of waiting long enough for one to be bright enough, we should be able to detect more pulses from this one because it's so bright.” says McLaughlin. We have been able to make more detailed observations of the repeating FRB than any others by virtue of its multiple blasts. A second repeater might help us figure out what FRBs really are. Leah Crane @"}, {"title": "Plastic in bottled water shouldn't be a worry", "author": "Andy Coghlan", "content": "Andy Coghlan THE discovery that most bottled water is contaminated with tiny fragments of plastic stirred up mild panic last week. But do these microplastics actually pose a risk? According to a study commissioned by Orb Media, a global consortium of journalists, samples from 93 per cent of 259 bottles contained microplastic particles - an average of 10 particles wider than 100 micrometres, or roughly the width of a human hair, per litre. The bottles were purchased from countries in five different continents, although not in Europe. Sherri Mason of the State University of New York at Fredonia, who carried out the work, found that 54 per cent of these particles were polypropylene, the plastic from which bottle caps are fabricated, suggesting that the caps may have been the source. Four per cent were industrial lubricants, so contamination probably happened in the factory. Mason also found smaller particles - an average of 325 per litre, although some samples contained up to 10,000 per litre. These were too small to be verified as microplastics, but it seems likely that they are, says Mason. These accounted for 95 per cent of all particles found, ranging from 6.5 to 100 micrometres in size. Does it matter if we swallow this stuff? We don't really know, but there's no need to panic. “There's no clear evidence about human health risks,” says Richard Thompson of the International Marine Litter Research Unit at the University of Plymouth, UK. Thompson says any risk depends on how many particles we are exposed to. The amounts in bottled water are probably minimal compared with other “Does it matter if we swallow this stuff? We don't really know, but there's no need to panic” sources, such as airborne dust and textile fibres, and food such as shellfish and crustaceans, which absorb the particles from the sea. Astudy on microplastics last year by the UN Food and Agriculture Organization estimated that hazards to seafood consumers are minimal, but deserve deeper investigation. Itcited research in rodents and dogs showing that microplastics larger than 150 micrometres aren't absorbed, but get excreted in faeces. In all, more than 30 per cent of ingested micro and nanoplastics pass through consumers like this, says the FAO. Particles less than 20 micrometres across seem to have more potential to cross into blood and accumulate in organs, but whether this is harmful is unknown. Only at unrealistically huge doses - millions of particles a day - were there even remote signs of concern in test animals, such as liver inflammation. “Such effects have so far not been reported in humans,” says the FAO report. Thompson doubts there is any reason to panic over the bottled water findings, also noting that the study hasn't been peer reviewed. “I'm not sayingit's not reliable, but it’s not gone through the normal processes that would ensure all the necessary details are there,\" he says. The most important thing, says Thompson, is that a huge amount of bottled water consumption in Western nations is unnecessary because tap water is high-quality and easily available. So next time you take a swig, don't worry about the minuscule plastic in your water - instead, fret about the environmental impact of producing and transporting something you really don't need. “That, to me, would bea much bigger concern,” he says. i 24 March 2018 | NewScientist | 25"}, {"title": "Genomics saves lives", "author": "Clare Wilson", "content": "SUPERFAST DNA sequencing is saving children’s lives. The technique has helped doctors in London quickly diagnose rare disorders in 10 critically I'll children, enabling clinicians to give better treatment and protect some from life-threatening complications. It took over a decade and around $2.7 billion to fully sequence the first human genome, but recent advances in technology have sped up the process and led to a fall in price. Ateam at London’s Great Ormond Street Hospital for Children has now used rapid whole-genome sequencing to diagnose children with unknown illnesses in intensive care, as these children often have rare genetic conditions. “These kids are so incredibly I'll,” says Hywel Williams at University College London, who worked with the doctors. “They may have trouble breathing, their heart may not be working well.” In such cases, it is hard to know what the cause is, he says. “But if you can find a genetic diagnosis, it really helps the clinicians.” Preventing harm The team cut the time it takes to give a genetic diagnosis from weeks toas little as four days by changing the settings on DNA- sequencing machines, using faster analysis software and getting hospital staff to prioritise urgent DNA samples. Of the 24 children whose genomes were sequenced, 10 received a diagnosis. This led to an immediate change of treatment for three children (bioRxiv, doi.org/cmsg). For one child who had failing kidneys, genomic sequencing revealed that the cause wasa rare mutation, which also leads to choose to eat between about 15 and 18 per cent fewer calories than the daily recommended limit, in the hope they will live longer. There is some evidence that such people have better blood cholesterol and glucose levels. Leanne Redman of Pennington Biomedical Research Center in Louisiana and her colleagues assigned normal or calorie-restricted diets to 53 adults. For two years, 34 of these people ate 15 per cent fewer calories than usual, while the others ate as much as they wanted. In the second year of the study, those eating fewer calories burned recurrent kidney tumours. As aresult, doctors realised they needed to remove both kidneys, before tumours could develop. Achild with a ruptured spleen was found to have vascular Ehlers-Danlos syndrome, which weakens internal tissues. Up until diagnosis, clinicians had suspected the child’s parents had been the cause of their injury, but the DNA results avoided a police investigation. A third child hada hormone disorder, and doctors changed how they managed the condition after diagnosis. When a child has serious and unexplained medical symptoms, it can often lead to repeated painful diagnostic procedures (see “Quest for diagnosis”, right). To keep costs down, doctors usually get only one or several genes sequenced at a time. There are thousands of genetic diseases, and as it can take weeks to get the results from each test, families can endure years of uncertainty. 10 per cent less energy - their metabolic rate - during sleep, and had lower night-time body temperatures (Cell Metabolism, doi.org/cmrx). Blood samples revealed a 20 per cent drop in damage to cells caused by the by-products of metabolism, known as cellular oxidative stress, which is thought to be a hallmark of ageing. Redman thinks the body adapts to low-calorie diets by lowering its “The body may adapt to fewer calories by lowering its resting metabolic rate, as hibernating animals do” But Williams’s team has shown that rapid genome sequencing is possible and cost-effective. It cost £5600 to analyse each child’s genome -only alittle more than the cost of a day in intensive care. “It’s pretty clear it’s going to transform intensive care practice,” says Stephen Kingsmore of the Rady Children’s Institute for Genomic Medicine “It's clear this is going to transform intensive care. This is totally miraculous for families” in San Diego. “For the families this is totally miraculous.” While four days for sequencing and analysing a genome using standard hospital equipment is impressive, Kingsmore’s team has managed even faster results using specialist sequencing equipment that isn’t yet widely available. Their fastest time to a genomics- based diagnosis is 19.5 hours. resting metabolic rate. This may be an evolutionary mechanism to save energy when food is scarce, as is seen in animals that hibernate. Luigi Fontana of Washington University in Missouri says this slowing of metabolism might not be what increases longevity in lab animals. Changes in how cells sense the availability of food are likely to be more important, he says. Even if caloric restriction is found to extend human lives too, it isn't for everyone. Side effects can include loss of libido and feeling cold. Andy Coghlan"}, {"title": "Calorie drop gets you ready for hibernation", "author": "Unknown", "content": "Calorie drop gets you ready for hibernation DRAMATICALLY cutting the calories you consume may extend your life, and now we have an idea why. After more thana year on a calorie-restricted diet, resting metabolism seems to change. Calorie restriction has been shown to extend the lifespan of flies, mice and even monkeys. Such findings have prompted some people to"}, {"title": "Silkworms made immune to disease", "author": "Michael Le Page", "content": "SILKWORMS can now fight off a lethal virus after being given an immune system found in many bacteria. The same approach could protect other animals and plants from viral diseases. The silk industry suffers huge losses from a virus called Bombyx mori nucleopolyhedrovirus (BmNPV). “It would be incredibly important to have virus-resistant silkworm,” says Fritz Vollrath at the University of Oxford. The key could be CRISPR. It is knownas the genome-editing tool revolutionising biology, but it evolved in bacteria as an immune system to protect against viruses. In these bacteria, CRISPR proteins first recognise the DNA of invading viruses, using “guide RNAs” that match the DNA sequence. They then cut up the viral DNA, preventing the virus making more copies of itself. Zhangqi Dong at the State Key Laboratory of Silkworm Genome Biology at Southwest University in Chongqing, China, and his colleagues gave silkworms the genes for the CRISPR protein Casg, plus guide RNAs targeting BmNPV sequences. They then exposed silkworms to the virus. The genetically modified silkworms only succumbed when given a dose 1000 times greater than that which killed ordinary silkworms (Frontiers in Microbiology, doi.org/gc4t8m). No other team trying to create virus-resistant silkworms has into conditions like post- traumatic stress disorder, and possibly even lead to new treatments that alter memories. Current therapies teach people with traumatic memories and phobias to change how they respond to them, but this can population now has internet access, but there is a stark geographical divide. Nearly 80 per cent of people in Europe are online, while in Africa the figure is just 20 per cent. Men outnumber women online in every region except the Americas. In Africa, there are three women online for every four men, a gap that has widened since 2013. Two-thirds of internet users live in countries that regularly censor the internet. WhatsApp, the most commonly used encrypted chat app, was blocked or throttled in 12 out of 65 countries examined by the report. Last year also saw a concentration of big tech power. Facebook added over a billion users across its different platforms, including WhatsApp and Instagram, while over 90 per cent of all web searches are done on Google. involve prolonged periods reliving a painful memory. Aone-off treatment to change a memory’s genetic signature from a negative pattern to a positive pattern could be a better way. Citri and his team have managed to do this in mice. They were able to change a mouse’s memory of an electric shock by injecting it afterwards with a gene that is involved in memory formation. The mouse no longer froze with fear when the memory was retriggered, says Citri. How an experience is encoded can reveal if it’s good or bad The memory code could even have forensic applications in the future, revealing the most recent experiences of someone who has been killed. “It’s a fascinating proposal,” says Clea Warburton at the University of Bristol, UK. Forexample, it might one day be possible to look at a brain region linked to recognition, and be able to tell whether a murder victim had seen someone they knew before they died. “But you would have to get in there extremely quickly, as proteins start to degrade within minutes of death,” says Warburton. “It probably wouldn’t give you more information than a good forensic scientist could, but Iwouldn’t be surprised if we end up with a film about this.” Understanding and treating memory loss may bea better application of the findings, says Warburton. “If we can identify the brain regions and proteins necessary for memory formation, we can go inand manipulate the neurons,” she says. “Then when people have brain damage, we could help restore memory.” &"}, {"title": "Sucking drinking water out of thin air", "author": "Unknown", "content": "Sucking drinking water out of thin air FRESH water pulled from the sky. it is anambitious goal, but to win the Water Abundance XPrize, teams have to extract 2000 litres a day from the atmosphere in a cheap and sustainable way. The five teams through to the finals were announced last week by XPrize, the non-profit that organised the competition. These had been whittled down from an initial field of 98 based on their prototypes. Final testing will happen in July. Teams must produce the water using renewable energy at a cost of no more than 2 US cents per litre. Whichever group extracts the most water at the lowest cost will receive $1.5 million. The World Health Organization states people need at least 20 litres of water a day for drinking and basic hygiene, butincreasing demand from growing populations and the impact of climate change means global fresh water supplies are rapidly depleting. come close to that level of success. Geneticists have long worked to create disease-resistant plants and animals, with some successes. In 1998, the papaya industry in Hawaii was saved by aGM variety resistant to the ringspot virus. But what protects one organism against one virus seldom works for other situations, so creating virus-resistant plants and animals can take years of trial and error. By contrast, the CRISPR immune The silk industry is plagued by a silkworm-killing virus this hidden source of water in a cost-effective and sustainable way,” says Zenia Tata at XPrize. The finalists have a variety of solutions. London-based Veragon already builds machines that condense water from the air by cooling it, and has teamed up with Imperial College London start-up ThinAir to supercharge the process with new materials. Laura Dean, “Whichever group extracts the most water at the lowest cost will receive “What we're trying todoistounlock $1.5 million” system should work in most plants or animals. Only the guide RNAs must change, which is easy. CRISPR won't fight infectious bacteria or fungi, but it should work against lots of viruses. The Casg protein that Dong’s team used only cuts up DNA, so it would only work against viruses that use DNA. But other proteins can target RNA. In February, a team in Saudi Arabia reported that it had protected tobacco plants from RNA viruses using a recently described CRISPR protein called Casi3a that cuts RNA (Genome Biology, doi.org/gct2s8). The potential downside of Dong’s approach is that the CRISPR protein and guide RNAs must be continuously produced in every cell. If the CRISPR protein targets silkworm DNA by mistake, it could make the animal I'll. However, the good news is that many teams are reporting no detectable effects for the host animal when guide RNAs are carefully designed. Dong’s team found none in the silkworms. Jennifer Doudna at the University of California, Berkeley, whose 2012 work helped spark the CRISPR revolution, says other teams have created mice whose cells permanently express Casg. “The mice seem fine,” she says. Other groups are modifying silkworms so their silk is more like spiders’. This is famously strong, but it is hard to farm spiders. @ who leads the team, says they expect to produce more than 5000 litres of watera day. Indian team Uravu is focused on asimple, low-maintenance solution using a silica gel whose structure let's it passively suck water vapour from the air. The idea is to collect water at night, then during the day solar collectors channel heat from the sun to warm the gel. This releases the vapour again, which is cooled back into water. The machine produces 10 to 15 litres of water a day, but multiple units can be linked together to meet the 2000-litre benchmark. Edd Gent 31 March 2018 | NewScientist |15"}, {"title": "Memory code cracked", "author": "Jessica Hamzelou", "content": "MEMORIES have a unique genetic signature in the brain—acode that has only just been discovered and unlocked. The findings, in mice, suggest we may be able to read people’s memories by examining the patterns in their brains, and even one day alter or repair them to treat psychiatric disorders or memory loss. The brain seems to store memories in new connections between neurons. To do this, the neurons need to make new proteins —a process that is thought to be controlled by hundreds of genes. While investigating how this works, Ami Citri at the Hebrew University in Jerusalem and his colleagues discovered that particular experiences —be itan electric shock or a hit of cocaine — elicit different changes in gene activity in the brains of mice. These mice were given a variety of positive or negative experiences, such as electric shocks to their feet, a sugar treat, a dose of achemical that makes them feel I'll or cocaine. An hour later, they were euthanised and the team looked at which genes were being expressed in seven areas of the brain that are “If we can identify what's necessary to make a memory, we could help restore damaged ones” involved in memory, including the hippocampus and amygdala. Citri was surprised to find that all of the mice given cocaine, for example, showed the same general pattern of gene activity. The patterns were so clear that the team could guess what experience a mouse had been through with over 90 per cent accuracy just by analysing the levels of activity of different genes in their brains (eLife, doi.org/cm6w).  While each experience had its own pattern, the signatures of the more positive experiences were relatively similar to each other, as were the negative ones, suggesting that bad memories and good memories are recorded differently. Previous events also had an effect. The memory of a dose of sugar had a different signature if it was a mouse’s first taste, or if it had already developeda sugar habit. “It’s very nuanced-we can separate out a wide variety of different experiences,” says Citri. “Each memory that’s being encoded has a unique input in the brain in terms of the genes switched on to encode it.” The pattern of gene activity seems to peak about an hour after the experience has taken place, says Citri. Amy Milton at the University of Cambridge says that human memory probably works in a similar way because we use the same mechanisms to form memories. “It’s potentially exciting,” she says. Citri hopes it will be possible to detect genetic memory signatures in blood samples, so that researchers can read this code in live animals or people. He says his team has had promising early results doing this in mice. If it works, it may help us understand how people can experience the same event in different ways. “People who are more resilient might encode memories differently,” says Milton. As wellas a peak in gene activity soon after going through an experience, Citri thinks that more subtle, permanent marks may be laid down on genes too. These epigenetic signatures might reveal something about the experiences in a person’s more distant past, says Citri, although he has not yet studied this. Genetic signatures that reveal a person’s subjective experiences could give doctors deeper insights"}, {"title": "Cleaner air really benefits kids", "author": "Unknown", "content": "Cleaner air really benefits kids CHILDREN benefit from even a small reduction in air pollution. The finding suggests that efforts to tackle air pollution really can make a difference. In 2007, levels of air pollution in the city of Stockholm in Sweden fell by about 5 to 15 per cent after it introduced a congestion charge. This small reduction seems to have halved the number of children admitted to hospital with asthma attacks, from 18.7 kids per 10,000 to 8.7 per 10,000, according to a study by Emilia Simeonova of Johns Hopkins University in Maryland (National Bureau of Economic Research, doi.org/cm2d). However, congestion charges alone do not necessarily reduce air pollution. In London, nitrogen dioxide levels rose by around 10 per cent in the four years after a similar congestion charge was introduced in 2003, according to findings presented last month at a meeting of the Royal Economic Society in the UK. This may have been due to a rise inthe proportion of diesel vehicles. The city plans to introduce tougher measures."}, {"title": "Over-the-phone abortion service", "author": "Unknown", "content": "THE world's first phone-based abortion service has been found to be safe, effective and convenient. Since 2015, women in Australia have been able to order abortion pills from a private provider, the Tabbot Foundation. After a woman requests the pills, a doctor calls her for a health check and to organise tests to confirm she is less than nine weeks pregnant. Then, a package of drugs is posted to her, and a nurse calls to explain how to take them. There is a 24-hour support hotline, and the nurse calls again later. Astudy of the first 1000 women who used the service shows that over 95 per cent had an abortion at home with no complications, and no need to see a doctor afterwards (Australian and New Zealand Journal of Obstetrics and Gynaecology, doi.org/cm7q). Two-thirds of Tabbot's clients were from rural areas. “It means they don't have to travel long distances or face possible judgement from the one doctor or pharmacist in their town,” says Paul Hyland, who set up the foundation."}, {"title": "Syrian chemical weapons attack", "author": "Unknown", "content": "INTERNATIONAL tensions have rocketed after a chemical attack in Syria killed at least 42 people on 7 April. Reports of victims with burning eyes and breathing problems suggest helicopters dumped chlorine bombs on the town of Douma, near Damascus. The Organisation for the Prohibition of Chemical Weapons (OPCW) is investigating. Syria signed the international treaty banning chemical weapons in 2013, under pressure from the US and Russia, after it attacked civilians with the nerve gas sarin. The OPCW says it destroyed 94 per cent of Syria's banned chemical weapons by 2014. Since then, Syria has repeatedly bombed civilians with chlorine, a chemical not banned by the treaty unless used as a weapon. In April 2017, it also attacked three villages with sarin. Russia denied Syria was behind that attack, but the US retaliated by bombing a Syrian airfield. After having reacted to the sarin attack, the US is under pressure to issue a military response again. "}, {"title": "Child cognition shaped by pregnancy", "author": "Unknown", "content": "THE brain function of infants may be boosted or hindered by infections experienced by their mothers during pregnancy. The finding makes it all the more important that pregnant women get vaccinated against flu and practise basic hygiene measures like hand-washing, says Bradley Peterson of the Children’s Hospital Los Angeles. Some microbes can directly infect a fetus during pregnancy and cause developmental problems. One example is Zika virus, which appears to infect fetal brain cells. But there is some evidence that maternal infections might also affect fetuses indirectly, by putting the woman intoa state of heightened immune system activity. Ahigher rate of schizophrenia has been detected among people who were born soon after the 1957 global flu epidemic, for instance. Other studies suggest flu may raise the chances of having a child who has schizophrenia from around 1 per cent up toas much as 7 per cent. Infections have also been linked to autism, attention deficit hyperactivity disorder and depression. But these studies aren’t conclusive and there has been infections debate about whether inflammation during pregnancy really does affect children’s brains. To get aclearer picture, Damien Fair of Oregon Health & Science University in Portland and his colleagues followed 46 women from pregnancy through to early motherhood. During pregnancy, they monitored the women’s blood for signs of inflammation. Two years after birth, the by headlines warning of the robot takeover. A 2013 study by the University of Oxford, for example, suggested robots are set to replace as much as 47 per cent of the US workforce and 35 per cent of the UK's. But far from this apocalyptic scenario, automation resulted in an overall increase in jobs of between 1.5 and 1.8 per cent in Germany between 2011 and 2016. While robots claimed 5 per cent of jobs, more new ones were created. What's more, most of these tended to pay better than those that had been lost. An industrial robot may replace researchers assessed the women’s children using a memory game in which they had to remember where stickers were hidden. The team found that infants who performed worse at the test had been born to women who showed signs of high inflammation during pregnancy. Looking back to brain scans taken when the children were 4weeks old, the team saw that those whose mothers had had higher inflammation during Inflammation during pregnancy can affect cognitive ability later on 100 workers, but there are knock-on effects that can add jobs elsewhere. “Now the company can produce the same good, but more cheaply. Demand goes up and they need to hire more people to fill the new demand,” says Melanie Arntz at the Centre for European Economic Research in Mannheim, Germany. The same effect should be seen in other countries, including the UK and US, she says. “An industrial robot may replace 100 workers, but knock-on effects can add jobs elsewhere” pregnancy had different patterns of connections between several parts of the brain involved in memory. This included a system that is involved in paying attention to important things, knownas the salience network (Nature Neuroscience, DOI: 10.1038/s41593-018-0128-y). But the picture isn’t clear-cut. Peterson's group recently dida similar study, in which they followed 21 pregnant teenagers and their babies. While they also found that higher inflammation in pregnancy was linked with altered brain connections in the salience network at a few weeks of age, this didn’t seem to have a bad effect. When tested at the age of 1, these infants actually had better cognitive abilities than those whose mothers had had less inflammation during pregnancy. That might be because the fetal brain tries to compensate for the damage caused by inflammation in a way that strengthens some cognitive abilities, says Peterson. “If there’s a problem in one part of the system, other portions kick in to try to right the ship,” he says. As wellas getting vaccinated against flu and practising good hygiene, Peterson suggests that pregnant women may want to wear face masks if they need to spend time with someone who has a contagious illness. Clare Wilson @ Previous studies also overestimated the relationship between jobs that can be automated and those that will, says Arntz. To come to this conclusion, Arntz and her colleagues surveyed 2000 senior managers at companies representing a broad swathe of the German economy. The researchers asked the managers to rate the level of automation at their companies in each year between 2011 and 2016. They then used data from the German Federal Employment Agency on around 300,000 workers to get the overall picture. Sally Adee 14 April 2018 | NewScientist | 9"}, {"title": "Robots aren't coming for your job after all", "author": "Unknown", "content": "ROBOTS are the great bogeymen of the 21st century. With their superhuman strength and non-stop work ethic, many feel they are gunning for our jobs. But these fears may be overblown. The first comprehensive look at automation on the German economy suggests that robots created more jobs than they destroyed. People's fears have been stoked"}, {"title": "IQ benefits men's mental health", "author": "Jessica Hamzelou", "content": "THERE'S more to intelligence than smarts. A high IQ seems to protect the brain from some of the effects of inflammation, including signs of depression. But the effect is seen only in men. Studies have found that people with depression or schizophrenia tend to have higher levels of inflammatory proteins in their bodies, indicating a heightened state of immune activity. For this reason, anti-inflammatory drugs are being trialled for both conditions. But not everyone with inflammation goes on to develop a mental-health disorder. Firini Flouri at University College London wondered whether intelligence may help protect some people from the effects of inflammation. Flouri and her colleagues analysed data from more than 9600 people in the UK, aged between 18 and 97. Each person had answered surveys about their mental health, including whether they were in psychological distress. High distress scores indicate that a person is more likely to develop depression, says Flouri. Blood samples that had been taken at the same time were used to measure inflammation levels. Each person also completed a battery of cognitive tests, which measured reasoning, memory and problem solving, among other things, to give an IQ score. After taking account of factors including the volunteers’ age, physical health and lifestyles, the team found that men—but not women -=who had higher levels of inflammation also showed more signs of psychological distress. This link was disrupted by high levels of intelligence: men with high inflammation who also had ahigh IQ seemed to be less likely to show distress (Intelligence, doi.org/cm2h). “There appears to be some protective effect of having a high IQ,” says Flouri. This may be because men who are more intelligent are more likely to take better care of themselves, and follow a healthy diet and exercise schedule, Flouri suggests. Hormonal differences between men and women might explain why inflammation and intelligence weren't linked to mental health in women, loot, rose by 230 per cent between 2016 and 2017, according to the European Association for Secure Transactions (EAST), which tracks ATM crime. About €1.5 million was lost that way last year. Card skimming incidents fell 23 per cent in the same period. Robbing individual accounts is also on the decline, but the number of physical attacks against cash machines, including trying to blow them out of walls, has risen. Overall, fraud attacks on ATMs in western Europe have dropped 11 per cent. The increasing use of chip and PIN on European cash cards is behind the 5 3 Z zg 5 5 g & inflammation (yellow) in the brain has been linked to depression says Flouri. Men have more testosterone, which is known to influence inflammation and stress. Immune system differences may be a factor too; women generally seem more prone to inflammation, and to some inflammation-associated disorders, such as autoimmune conditions. It is also possible that women are more likely to experience types of stress - abuse, perhaps— that affect inflammation and mental health in different ways. Early life experiences and genetics probably also have an effect, decrease in card skimming, says Lachlan Gunn of EAST. “Organised criminals may be switching to malware and logical attacks to cash-out at ATMs instead,” he says. Different versions of ATM malware, including one called Cutlet Maker, which overrides the ATM operating system and sends instructions to empty the machine's cash reserves, have been offered for sale on the “Physical attacks against cash machines, including trying to blow them out of walls, are on the rise” says Golam Khandaker at the University of Cambridge. But Carmine Pariante at King’s College London doesn’t think the evidence is strong enough yet to accept that there isa difference between men and women when it comes to inflammation affecting mental health. Taking steps to boost aspects of your intelligence — by training memory, for example-might potentially help you avoid the effects of inflammation. But the best bet is probably to adopt a generally healthy lifestyle. “If we take measures to keep inflammation down, it should have a positive impact on a number of factors,” says Khandaker. @ dark web for as little as $5000. There may be another explanation, though. Card skimming incidents reduced significantly in july 2017, around the same time as Alexandru Sovu, who manufactured card skimmer circuit boards, was arrested by UK police. “Once you destroy the market, you destroy the crime,” says Nick Webber of CELT, a digital forensic analysis consultancy. Gangs focused on installing card skimmers on ATMs are thought to have refocused on the US, where chip and PIN is less widely adopted. Chris Stokel-Walker"}, {"title": "How scammers prefer to get free money", "author": "Unknown", "content": "CARD skimmers are so passé. More scammers are directly hacking into cash machines to make them spit out money in central and western Europe, while the use of card skimmers that capture card details as someone uses an ATM isin decline. Malware scams and “logical attacks”, in which computers are plugged into acash dispenser to gett to give up its"}, {"title": "Health benefits of a month off booze", "author": "Andy Coghlan", "content": "GIVING up alcohol for a month has a dramatic effect on health, lowering blood pressure, cholesterol and diabetes risk. It can also drastically reduce levels of cancer-related proteins in the blood, according to the first wide-ranging study of the benefits of periods of abstinence like “Dry January”. The study involved 141 moderate-to-heavy drinkers. On average, they drank more than double the UK recommended limit, consuming around 30 units a week — the equivalent of about three bottles of wine or more than 14 pints of beer. For the study, 94 of them gave up drinking for a month, while the rest continued to drink as usual. A team at the Royal Free Hospital in London analysed blood samples taken at the start and end of the month from each participant. The people who carried on drinking showed no particular changes over the course of the month. The abstainers, however, displayed big improvements, confirming those reported in asmall study of 14 New Scientist staff in 2013. The most striking change was in insulin resistance. This occurs when the hormone insulin becomes less effective at making the body remove sugar from the bloodstream, raising the risk of type 2 diabetes. After a month, abstainers saw their insulin resistance fall by an average of 26 per cent. “Our data suggest that alcohol use above recommended guidance markedly increases the risk of type 2 diabetes,” says Gautam Mehta of University College London, who led the team together Your Go-To § with his colleague Kevin Moore. The abstainers also saw improvements in liver health plus an average 13 per cent fall in cholesterol levels, a 6 per cent drop in blood pressure, and a 1.5 per cent decline in weight (BMJ Open, doi.org/cpms). “Over one month, that’s as much as you could hope to lose if you were dieting,” says Mehta. Surprisingly, the team also founda dramatic drop in the levels of two growth factors “After a month without alcohol, there was a dramatic drop in growth factors linked to cancer” linked to cancer. One, vascular endothelial growth factor, helps tumours grow by building networks of blood vessels. After amonth of sobriety, levels of this substance in the blood fell by 41per cent. There was alsoan average drop of 74 percent in levels of epidermal growth factor, which promotes cancer growth by encouraging cells to multiply. “The reductions were very striking,” says Mehta. “They fell >paration in almost every abstaining participant,” he says. “They are only correlations at this stage, but deserve further investigation,” says Ketan Patel of the MRC Laboratory of Molecular Biology in Cambridge, UK. The evidence that drinking leads to cancer is well-established and overwhelming, he says. “The question is by what mechanism.” Mehta suggests that alcohol may help push small tumours to progress into more serious cancer. Although the study included acomparison group that continued to drink, one limitation is that the participants all knew whether they were in the control group or the drinking group. Unsurprisingly, it’s difficult to do experiments where the participants don’t know if they are drinking alcohol or not. In theory, those who abstain from drinking may be influenced by a placebo effect, or unknowingly feel encouraged to pursue other healthy lifestyle changes in the course of the study, distorting the results. However, Mehta says that the team did not see any changes in participants’ reported lifestyles, diets and exercise regimes during the study. Despite the observed benefits ofamonth’s abstinence, Mehta warns that people should not assume that their body and liver are fully “detoxed” and ready for bouts of excessive drinking after doing Dry January. The findings are very positive, but we don’t know how long they last, he says. However, the act of abstaining for a time seems to also havea beneficial effect on drinking habits. When the researchers contacted the abstainers around seven months later, they found that they were drinking 20 per cent less alcohol on average than they used to. “Tt shows if you have a month off, it can reset your relationship with alcohol long-term,” says Nick Sheron at the University of Southampton, UK. & 19 May 2018 | NewScientist | 7"}, {"title": "Apps hunt for early signs of dementia", "author": "Jessica Hamzelou", "content": "SAFARIS and sea adventures could be testing in more ways than you might think. These are some of the scenarios featured in a spate of new games and apps, with the aim of identifying signs of dementia years or decades before a person might typically receive a diagnosis. Though there is currently no cure for dementia, spotting it early enough might reveal the parts of the brain that are affected by the disease first, which in turn may help to slow its progression. One skill that a game can probe is the processing of spatial orientation. Disruption to this ability is one of the earliest clear signs of Alzheimer’s disease, says Hugo Spiers at University College London. Spiers has collaborated on the design of Sea Hero Quest, a game that requires players to travel the oceans on a mission to regain lost memories. Although this is purely ~ agameat present, Spiers and his colleagues are working on a version that uses a person’s score to tell their doctor of any early signs of Alzheimer’s. DELMAINE DONSON/GET Add-on for surfboards can fend off sharks AN ELECTRIC device that attaches to surfboards could halve a surfer’s risk of getting attacked by sharks. Although rare, shark attacks are on the rise, with the number worldwide going from about 20 to 80 cases a year over the past three decades. Many shark repellent products for surfers are now on sale, but few have been rigorously and independently tested. Sina Habibi has a similar goal for an app released by his company Cognetivity, a University of Cambridge spin- out. Cognetivity’s 5-minute test, played on an iPad, shows users a variety of scenes in rapid succession. Their task is to pick out those that contain animals as quickly as possible. Habibi’s team chose to focus on visual processing because this is another Charlie Huveneers at Flinders University in Australia and his colleagues decided to assess five of the most popular products. These included two devices that create electric fields, two that create magnetic fields, and a smelly wax. The researchers carried out 50 trials per product, attaching or applying it to surfboards placed 30 kilometres off the coast of South Australia - in waters where sharks are fairly common. A piece of tuna dangling below each board mimicked a surfer's foot, while an underwater camera filmed any shark interactions. of the first skills to decline in the early stages of dementia. BrainTest takes yet another approach. Developed by a Canada- based company, it is based on existing tests that assess a range of cognitive skills, including the ability to perform calculations, spatial orientation and language. If youask any of the companies involved, they will say their own test is the best, says Carol Routledge, head of research at Alzheimer’s Research UK, based in Cambridge. Given that all the tests focus on different aspects of brain function, which one gives us the best indication of dementia? “We don’t know,” says Four of the products had no significant effect, the team found in areport published by the government of New South Wales. But a device made by an Australian company called Ocean Guardian halved the number of shark attacks on the bait. The device attaches to the tail of a surfboard and is designed to create astrong electric field. The aim is to overwhelm the sensory receptors that “The aim is to overwhelm the sensory receptors that sharks use to detect weak electric signals from prey” Routledge, “because we don’t [yet] diagnose dementia early enough.” As more people use the apps, a winning strategy may eventually emerge. However, even if one day we learn that visual processing, for example, is the first sign of the onset of dementia, it would take alot more work to figure out exactly which form of dementia will probably develop. “There are up to 80 different diseases that can cause dementia,” says James Pickett, head of research at the Alzheimer’s Society, a London-based charity. The various forms can affect different regions of the brain in their own ways and symptoms can vary, so it is important to be able to tell them apart. Most people with dementia aren't diagnosed until their 70s and 80s, when symptoms are noticeable. The underlying brain changes are thought to start some two to three decades before then, soa simple test for early dementia is a worthy goal, says Pickett. To date, all of the hundreds of clinical trials of drugs for dementia have failed — probably because the tests involved people whose brain damage was already too severe to be remedied, he says. If there were a way to identify such people in the first stages of the disease, we would have a much better chance of treating them successfully. m"}, {"title": "Does cannabis oil really help people?", "author": "Alison George", "content": "MEDICINAL cannabis is in the headlines after Billy Caldwell, a 12-year-old British boy with severe epilepsy, had his cannabis oil medication confiscated. The UK government has now announced a review into medicinal cannabis. Here’s what you need to know. what is cannabis oil? Cannabis oil is extracted from the cannabis plant, Cannabis sativa. Some varieties of the plant contain high levels of the psychoactive substance tetrahydrocannabinol (THC). The plant’s other major chemical component is cannabidiol, which has little or no psychoactive effect. So can cannabis oil make you high? It depends on the THC level. Some types of the plant, known as hemp, contain little THC. Extracts from these contain mainly cannabidiol. Is cannabidiol legal? It is legal in the UK. Cannabis oils are available in high-street shops, but the THC content must be below 0.2 per cent. The oil used to treat Billy Caldwell, which was obtained in Canada, contained a higher dose. And cannabidiol is illegal in many other countries. In the US, it isa schedule 1 substance, the most stringently controlled, and can be sold only in states where cannabis use is legal. PRESS EYE LTD/REX/SHUTTERSTOCK What is the evidence that cannabis oils can help treat epilepsy? Recent trials showed that cannabidiol is effective at treating two severe forms of epilepsy: Lennox-Gastaut syndrome and Dravet syndrome. The issue is less clear for commercial cannabis oils, where evidence is mainly anecdotal, and oils can contain differing amounts of THC. Are there any cannabis-based epilepsy drugs on the market? Yes. On 25 June, the US Food and Drug Administration approved a drug called Epidiolex for Dravet syndrome and Lennox-Gastaut syndrome (see page 7). The active ingredient is cannabidiol. This is Mystery gibbon found in ancient royal tomb AROUND 2200 years ago, the grandmother of the first emperor of China was laid to rest. But Lady Xia was not alone in death. Buried alongside her was a previously- unknown species of gibbon, and the ape was probably her pet. Lady Xia’s tomb in modern-day Shaanxi, the second largest known in China, was excavated in 2004. Inside, the partial facial bone and lower mandible of an ape was found. Now, 8 | NewScientist | 30 June 2018 analysis of the bones has revealed it to be an entirely new species. The ape was identified by Sam Turvey at the Institute of Zoology in London and his team, who named it Junzi imperialis. The facial bone (pictured) has upper teeth including two large canines, the nose cavity and part of the eye socket and forehead. The mandible also includes teeth. Enough detail remained for distinctive features in the cranial bone and teeth to be compared with corresponding ones from data sets of hundreds of gibbons from present-day species. The comparisons revealed Junzi was also anew genus, the first time the FDA has approved a drug that contains a purified form of marijuana. The drug contains no THC. “There is currently very little scientific evidence to support cannabis oil containing both THC and cannabidiol as a treatment for epilepsy,” said the charity Epilepsy Action, in a statement. Are cannabis-based medications available for other conditions? They are. A synthetic version of THC called nabilone has been used since the 1980s to treat nausea after chemotherapy. Adrug called Sativex is also approved in some countries, but not the US, to treat pain and The newly discovered ape is another species we seem to have wiped out Billy Caldwell and his mother, Charlotte spasms in multiple sclerosis. It contains high levels of THC as well as cannabidiol and so would be unsuitable for treating children with epilepsy. what is the aim of the UK government's review? First, it will look at the evidence for the therapeutic value of cannabis-based products. Depending on what that discovers, the Advisory Council on the Misuse of Drugs can recommenda change to the legal medical status of cannabis andits active ingredients. @"}, {"title": "The Inflamed Mind: A radical new approach to depression by Edward", "author": "Clare Wilson", "content": "WHEN a powerful new arthritis medicine called Remicade was first given to patients at a London hospital, the nurses noticed an unexpected side effect. The infusion made people so cheerful, all the staff wanted to be the one to set up the drip. They called it the “Remicade high”. The medicine works by blocking a signalling molecule in the blood called TNF. It was designed to calm the inflammation behind arthritis, so why should it affect people’s mood? This puzzling observation is just one clue that the state of enhanced immune activity we call inflammation could also explain depression, argues Edward Bullmore in The Inflamed Mind. Depression is the most common mental illness, but our existing antidepressant treatments are inadequate. A new understanding would be Nobel-worthy. Bullmore’s take on depression is fascinating and provocative, but it didn’t leave me feeling that the case is closed. The standard explanation is that depression is caused by some sort of imbalance of the chemicals used by brain cells, such as serotonin. Antidepressants like Prozac boost serotonin levels. But these medicines aren’t very effective —indeed, for many, they don’t work at all — soit looks Mental stress causes inflammation. Can this lead to depression? 46 | NewScientist | 30 June 2018 as if we are missing something. Most of us know inflammation as something affecting a small part of the body. For instance, if we cut our foot it becomes red, swollen and painful. This is when immune cells rush to the area and release compounds to fight off invading bacteria. It also encourages us to rest our injured limb. There is also a whole-body state of slightly raised immune activity called systemic inflammation. This was first identified in clearly inflammatory diseases such as rheumatoid arthritis, but it occurs more widely because it has been linked to obesity and ageing -—as well as psychological stress. The intriguing idea at the heart of this book is that mental adversity causes inflammation, which then causes depression. This mechanism might even be helpful— provided it doesn’t “Even if inflammation isn‘t the grand theory of everything, understanding it would be areal advance” persist for too long—because it makes us want to crawl away and rest our whole body, removing us from the stress. Bullmore takes us on a tour of the growing evidence supporting this idea, such as studies showing that people under stress have higher levels of inflammatory molecules in their blood, as do people with depression. Apsychiatrist at the University of Cambridge, Bullmore skilfully interleaves tales of his patients with the science. But for me, it rings false when he implies that objections to the idea stem from the outdated Cartesian view that the mind exists outside the physical realm, so its maladies could not have physical causes. Today’s psychiatrists are happy enough to treat depression with the very physical remedy of Prozac. And while Bullmore makes a good case that inflammation causes depression, if anything, his advocacy is too strong. I would have preferred a more impartial account of the evidence, both for and against. According to some studies, only a third of people with depression have raised levels of inflammation — so where does that leave everyone else? Still, even if inflammation isn’t the grand theory of everything that Bullmore would like it to be, understanding the role it does play would be areal advance. Bullmore hopes for a future when blood tests can indicate whether people have “inflamed depression” and, if they do, they will receive anti-inflammatories, perhaps including some of today’s arthritis medicines, rather than Prozac. Despite my caveats, anyone interested in how the mind works will enjoy this book. With concerns growing over the § risks and benefits of existing antidepressants, this is one area that desperately needs an infusion of new ideas. ™"}, {"title": "Drug lets you control dreams", "author": "Alice Klein", "content": "EVER wanted to fly? A drug that helps people take charge of their dreams could let you try it from the comfort of your own bed. A few people have lucid dreams, in which they recognise they are dreaming and steer the path they take. Some others can learn to induce them using cognitive techniques. The practice is most commonly used to pursue fantasies, but it may also help with nightmares, says Benjamin Baird at the University of Wisconsin-Madison. However, its therapeutic potential has been limited by it often being so hard to achieve. Now, Baird and his colleagues have developed the most effective method yet for promoting lucid dreams, by combining cognitive training with a drug. The researchers taught 121 adults aged 19 to75 a cognitive technique for stimulating lucid dreams. It involves picking a feature of a previous dream called a“dreamsign” that can serve as a reminder to become lucid when encountered again. The volunteers were then Paper batteries use bacteria to make electricity APAPER battery powered by electron-harvesting bacteria could one day power environmentally friendly disposable devices. Researchers have been working on paper sensors and circuit boards for years, but they have mostly been powered by traditional batteries or simple chemical reactions. Yang Gao and Seokheun Choi at Binghamton handed capsules of galantamine, which is used to treat mild to moderate Alzheimer’s disease. This drug boosts the brain chemical acetylcholine, which boosts memory, but also promotes rapid eye movement (REM) sleep, the phase in which dreams are most common. Each person got a high-dose capsule, a low-dose capsule and a placebo capsule, but they couldn’t tell which was which. On three occasions, they woke in the middle of the night, took a capsule, visualised their dreamsign and went back to sleep. ‘The high dose was most effective, inducing lucid dreams in 42 percent of participants. About 27 per cent reported lucid dreams with the low dose and 14 per cent after taking the placebo capsule (PLoS One, doi.org/cs38). The galantamine-induced dreams varied widely. One participant became lucid while dreaming about falling donkeys and actively flew out of their way. Another fulfilled her fantasy of rollerblading through a shopping centre after realising she was in a dream. The lucid dreams were rated as being more vivid, University in New York created a paper battery powered by bacteria to do the job instead. The battery is made of waxed paper, with thin layers of metals and polymers printed on top to hold bacteria and harvest electrons. The type of bacteria used, called exoelectrogens, pull electrons from the molecules they eat and transfer them outside their cells. The battery is freeze-dried to place the bacteria in a dormant state. It is packaged with a small pouch of liquid bacterial food. When the device is squeezed, the liquid revives the a = z = 5 Zz & = Lucid dreams were rated as being more vivid than the reqular sort complex and emotionally positive than regular dreams. Common side effects of galantamine in people with Alzheimer’s disease include stomach upsets and tiredness. In the study, 4 per cent of participants reported nausea, 6 per cent experienced insomnia and 2 per cent felt fatigued. Baird has experimented with galantamine himself. One time he took it, he dreamed about being inan unfamiliar house. As he inspected different objects, he was astonished at how real they felt. “As Iran my hand along a brick wall, for example, I could feel the bacteria and they start eating the organic material from the pouch. Through a series of reactions, electrons from the food are moved through the bacteria, eventually being absorbed into the battery, where they can be used to power small devices. The batteries have a shelf life of about four months and can provide power for up to two days. The researchers presented their “The batteries have a shelf life of about
