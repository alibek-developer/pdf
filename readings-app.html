 which plays an important role in memory, new cells are formed throughout life. It takes energy to do this, yet these cells seem to overwrite established memories and induce forgetting. Why should the brain invest energy in dismantling its own memories? The issue isn't storage space: given the number of cells and connections in the brain, there is reason to think we could remember much more than we do. According to Blake Richards at the University of Toronto, Canada, the goal of memory isn't to store information indefinitely, but to optimise decision- making in the future (see “What is memory for?\", page 32). And it seems that forgetting most of our experiences actually helps us learn important lessons. Each memory is thought to be storedin | EMORIES fade quickly, as we all know DOES CLOSING YOUR EYES TRULY HELP YOU REMEMBER? Yes. Vision is our dominant sense and a key source of new information. When an interconnected network of brain cells. To retrieve a memory, you need some part of its content: for example, to recall who came to your last birthday party, you might start by picturing where the party took place. Artificial intelligence researchers have built computer programs that work on the same principles, known as neural networks. They have found that when memories are distributed across interconnected units like this, there is a lot of potential for what's called interference, in which one memory effectively impedes the recall of another. This is especially true if they share some of the same content, so you might end up confusing memories of two birthday parties that happened at the same venue. In addition, if you store memories that are no longer useful, there's a high risk that they will hamper the storage of new memories. Having fewer memories can also make it easier to spot important patterns that help us plan for the future. By remembering instances when traffic was bad on your commute, for example, you would learn which times to avoid. Remembering every single journey would make it impossible to identify such patterns. Even so, there are less practical reasons for forgetting, especially as we age. Our WHEN OTHER PEOPLE WHY IS IT THAT YOU ONLY REMEMBER SOME THINGS you try to think of something, seeing the world in front of you is a major distraction. So, closing your eyes helps limit the distraction, especially when you try to retrieve a highly visual piece of information. But it’s highly individual. Some people may find it works while others don't. YY 40 | NewScientist | 27 October 2018 TRIGGER THE MEMORY? We store a lot more information in the brain than we can intentionally recall. What we can retrieve depends largely on the cues given, either from other people or the environment. If memories are a pile of jigsaw puzzle pieces, cues are the picture on bodies simply aren't adapted to living quite as long as we do, says Aoife Kiely from UK charity the Alzheimer's Society. Aside from some new cells in the hippocampus, “the neurons you are born with are pretty much the ones you are going to live your whole life with\", she says. “It is certainly an issue of wear and tear of the brain.” As we age, we lose many of the connections between these neurons, the box — it activates the connections that memory fragments are attached to. But sometimes, a friendly prompt can mess with your memory. Imagine you went to a concert with a friend who later said to you: “Remember they sang such- and-such song?” Each time you recall a memory, it becomes fragile and vulnerable to change. Even though you don't actually remember, you've heard of this song, your friend looked very confident and you may end up convincing yourself about this experience. And this becomes a new memory (see “Can | trust my memories?”, page 36). YY"}, {"title": "How does ageing affect memory?", "author": "Unknown", "content": "and immune cells in the brain can also begin to run amok. Still, factors like health and education play a large role in how our memory fares as we age, Kiely points out. And even when memories seem to have disappeared, they are often still lurking somewhere, it is just that we can’t or don't retrieve them - until the right moment comes along. Sam Wong and Catherine de Lange WHAT IS PHOTOGRAPHIC MEMORY? Photographic memory is the ability to recall a past scene with great accuracy. Some people have better visual memory than others, especially those with highly superior autobiographic memory (HSAM). We don't know why, but their memory seems to work the same way, yet is somehow better organised, so they can retrieve more details. But their memory isn't perfect - flashbacks as real and precise as photos are amyth. YY Pd 2 g ES z a How can two people remember the same event differently? determined to clear the air. But the more you talk about the argument with your partner, the more you struggle to hide your incredulity. How can their recollection be so, well, wrong? It’s as if you are reading from different scripts. In some ways, you are. To understand how people can experience the same event but recall it so differently, we need to forget our assumptions about how memories work, says Signy Sheldon at McGill University in Canada. We tend to think of memories as information stored in the filing cabinet of the brain for future use. In fact, they are only built when we retrieve them. All the information you were bombarded with during that argument - what was said, the scene, your feelings and reactions —was just sitting there gathering dust. It wasn’t until you called the event to mind the next day that you created a mental representation of what happened. And ofall the details you could have picked out, you can bet you didn’t focus on the same ones as your sparring partner. One reason for this is very basic. “We are now understanding that there are strong individual differences in how people remember,” says Sheldon. What's more, these differences are etched in our brains. Hints at what is going on come from people who have aphantasia, the inability to form mental images in the mind’s eye. Unsurprisingly, such people’s memories also lack a visual component, even though they can recall facts. Sheldon and her colleagues wondered whether this might help in understanding the different ways other people remember things. Exploring this possibility, they asked people to complete a questionnaire about how they tend to remember, before having their brain scanned. The team found that people’s memory style was reflected in their brain connectivity. Those who were better at remembering facts had more physical links between the hippocampus, and the prefrontal cortex, which is involved in reasoning. Those with richly detailed “autobiographical memories”, by contrast, had more connectivity between the hippocampus and | it is the day after a blazing row and you are areas involved in visual processing. “People’s brains are wired differently depending on how they naturally approach the act of retrieval,” says Sheldon. Beyond individual brain differences, there are other reasons why two people might have conflicting memories of the same event. Their emotional response to it is one. “We now understand that there are strong individual differences inhow people remember” “Emotional events can be recalled much more naturally, almost like they are stamped in our minds,” says Sheldon. It is as if we shine a spotlight on the things that really matter to us. What we remember will also be affected by whether we consider it useful. And there are benefits to that too. It can help us learn lessons and bond with others. The malleability of memoryisoftenseenassomethingthat’sbroken, says Sheldon, “but it’s really very adaptive”. Catherine de Lange 27 October 2018 | NewScientist | 41 5 3"}, {"title": "Happy New You", "author": "Linda Geddes", "content": "START EMBRACING NATURE In the Shetland Islands, off the north coast of the UK, doctors are handing out some unconventional prescriptions. Along with regular therapies, people with a range of physical and mental ills are being told to take in the sounds and smells of seabird colonies, build woodland dens or simply appreciate the shapes of clouds. A similar scheme in New Zealand found that, six to eight months after receiving a “green prescription”, two-thirds of patients were more active and felt healthier, and almost half had lost weight. Meanwhile, so-called eco-therapy, which involves participating in outdoor activities such as gardening or conservation, is emerging as a promising treatment for mild to moderate depression. In fact, we have long recognised that people living in greener neighbourhoods tend to have better cardiovascular health and lower levels of stress, regardless of their socio-economic 26 | NewScientist | 5 January 2019 status. Recent research also suggests that city dwellers living near green spaces are at lower risk of type 2 diabetes. And it seems the greater the biodiversity in green spaces, the larger the benefit to our psychological well-being. Various explanations have been proposed for such findings. Simply being outside boosts exposure to bright light, which is known to be an effective treatment for both seasonal and non-seasonal depression (see “Start brightening up your day”, page 29). Then there are the benefits of exercise, social contact and time out from everyday problems. Yet, connecting with nature seems to provide additional physical advantages. “We know that our heart rate slows down, we are less stressed, we breathe better and our immune responses are improved when we are in green space,” says Rachel Stancliffe of the Centre for Sustainable Healthcare in Oxford, UK. “Although we don’t completely understand those things, we think it is related to a reduced stress response, which is partly a mental and partly a physical thing.” Some people believe that having evolved alongside nature, we possess an instinctive urge to seek out and respond positively to it. Even exposure to nature in the form of images of natural scenes or recordings of birdsong can reduce heart rate and blood pressure, enhance attention and distract from pain. One study found that diffusing pine oils into people’s bedrooms while they slept led their bodies to produce more natural killer cells, which fight viruses and cancers. Regardless of the mechanism, getting outdoors is good for you. Adda social and physical element — by joining a hillwalking group or volunteering at acommunity allotment (see “Start helping others”, page 29), for example -—and the benefits will be heightened. What could be more natural? > START | EARNING A NEW LANGUAGE At this time of year, many people’s thoughts turn to physical exercise to work off the excesses of the festive season. But mental exercise is equally important. So, what is the best way to hone your mind, improve your thinking skills and help stave off cognitive decline as you age? Puzzles and brain-teasers area popular choice, but somewhat lacking. “The problem with things like crosswords and sudoku is that they aren’t very varied,” says Thomas Bak at the University of Edinburgh, UK. “It is like going to the gym and using only one machine: your biceps might become strong, but you won't be properly fit.” To get a bigger bang for your buck, you need something more like circuit training or parkour. That is why one of your best options is to tackle a foreign language. This will provide a mental workout comprising many different skills, from perception to the suppression of your native tongue to learning grammatical rules, which can be almost mathematical. If you speak to others, you get the bonus of social interaction too. Learning a new language may be hard work, but the payoff is impressive. For a start, it can improve your mental focus. Following an intensive, week-long Gaelic course, people were better at paying attention and suppressing irrelevant information. The effect gradually wore off, however, ifthey didn’t stick with their language practice. Other studies indicate that people who are bilingual have improved executive function — the ability to plan, organise and complete tasks— although these results have recently been disputed. There is also evidence that they develop dementia four years later, on average, than people who are monolingual—and that they recover faster if they have hada stroke. If languages really aren’t your thing, you might consider taking up a musical instrument or joining a choir, instead. Music training utilises many of the same skills as learning a language, and has been associated with improved memory, attention and empathy. It may even improve your ability to acquire new languages. 28 | NewScientist | 5 January 2019 START CUTTING BACK ON ALCOHOL No doubt, you have heard of Dry January. The idea is that by foregoing all booze for a whole month, you make amends for recent excesses and reset your relationship with alcohol. It is aneat challenge. But is it worth the effort? In the short-term at least, it appears to have health benefits. A recent study of moderate to heavy drinkers who had stayed sober for amonth recorded a significant drop in insulin resistance - suggesting their risk of developing type 2 diabetes went down - as well as reductions in blood pressure, cholesterol and two growth factors associated with the development of cancers. Whether Dry January changes long-term behaviour is less clear, however. Only one study has directly assessed this. It found that people who completed the challenge claimed to be consuming less alcohol six months on: the average number of days per week on which they had a drink had fallen from 4.7 to 3.7, and the number of drinks they consumed each time fell from 3.7 to 3.1. However, 36 per cent of participants failed to complete the challenge, and for this group, the reduction in alcohol consumption at six months was smaller. These results may not be representative either, as three-quarters of participants didn't complete the six-month follow-up survey. “Overall, I think that initiatives like Dry January are a good thing because anything that gets people thinking about their relationship with alcohol is positive,” says lan Hamilton at the University of York, UK, who specialises in substance abuse. “The problem is that - even if they achieve the month's abstinence - it kind of let's them off the hook for the rest of the year. | would much prefer for people to go through January drinking, but committing to having at least two consecutive days a week drink-free, which would be easier to sustain.” Going “damp” rather than “dry” gets support from research published in August suggesting that a drink a day might help ward off dementia, because small amounts of alcohol stimulate the system that flushes toxins out of the brain. But the same month, a large and widely reported study in The Lancet concluded that there is “no safe amount of alcohol”. It calculated that consuming even one drink a day - equivalent 5 3 z 3 g 3 START BRIGHTENING UP YOUR DAY You may not realise it, but you are probably light deprived. The intensity of light is measured in lux. Standard office lighting tends to be around 200 lux. Even onan overcast winter's day, it is around 10 times brighter outside, and on a sunny summer's day it is up to 500 times brighter. Yet, the average Westerner spends around 90 percent of their time indoors. This is a problem. Bright light stimulates your brain, boosting alertness and reaction times. It strengthens our circadian rhythms, the 24-hour fluctuations in our biochemistry and behaviour that enable us to perform optimally around the clock. Spending much of the day indoors — along with exposure to artificial light long after sunset —can subdue these rhythms, disrupting sleep and increasing the risk of conditions such as depression and dementia. Light also affects our moods, so much so that bright light is used to treat seasonal affective disorder (SAD), and exposure to it soon after waking is to 10 grams of alcohol or 1.25 UK units - increases people's risk of developing one of 23 alcohol-related diseases by 0.5 per cent. And the risk rises steadily the more you drink. That is sobering. But nothing in life is without risk, says statistician David Spiegelhalter at the University of Cambridge. Even the authors of The Lancet paper consider that figure “neither practically nor statistically significant”, he notes. It means that 25,000 people would need to drink this amount for one additional person to develop such a disease each year. “Even if you did believe that number, many people might feel that one drink a day is worth the totally trivial risk - just as many feel it’s worth driving a car or getting out of bedin the morning,” says Spiegelhalter. He argues for the promotion of two alcohol thresholds: a low-risk one at around 14 units a week, and a high-risk one at around 50 units for men and 35 for women. “At that level, there's about a one-in-eight chance that alcohol will kill you,” he says. A sober resolution would be to get as close as possible to the lower threshold - and ideally below it. as effective for general depression as antidepressant drugs. One obvious solution is to spend more time outdoors, particularly in the morning when your circadian clock is most responsive to the effects of light. If that isn’t an option, special lighting can help. German researchers found that people exposed for 3 hours during the morning to bright, blue-enriched light (of the sort you get from a lamp designed to treat SAD) improved their reaction times, suggesting they were more alert, both at the time and for the rest of the day. The light also appeared to lessen the effects on sleep and circadian rhythms of being exposed to artificial evening light. All good reasons to brighten up your life. “Bright light stimulates your brain, boosting alertness and reaction times” = Z Z i 2 START HELPING OTHERS The essence of life, wrote Aristotle, is to serve others and do good. Make this the basis of a New Year's resolution and you will be doing yourself a favour too. It turns out that people who volunteer are happier and healthier on average than those who don't. You can get these benefits by giving time to a cause you care about, whether related to the arts, the environment, politics or whatever. However, the biggest boost comes by doing work directly focused on helping others. It may seem counter-intuitive, but taking on extra responsibilities can reduce stress. Consider, for example, a study by Rodlescia Sneed, now at Michigan State University, and Sheldon Cohen of Carnegie Mellon University. They took blood pressure measurements from around 6700 people aged over 50, then simply let these people get on with their lives for four years before taking another measurement. What she and Cohen wanted to find out was whether volunteering would make a difference and whether more volunteering would provide even more benefits. The results were conclusive. Compared with non-volunteers or those who had done less than 200 hours of voluntary work in the preceding two years, more active volunteers were 40 per cent less likely to have developed high blood pressure. One possible explanation is that volunteering takes your mind off your own troubles and may provide a sense of perspective. Another is that altruistic behaviour triggers the brain's reward circuitry and the release of the “bonding” hormone oxytocin, both of which can reduce stress. “Stressis very much linked to high blood pressure,” says Sneed. There is even more to be gained by helping others as we age. Sneed recently found that people who help care for their grandchildren stayed mentally sharp for longer than their counterparts, She believes social interaction is the key here. “There is alot of evidence that people who have lots of social interaction, or are more socially engaged, have better health outcomes,” she says. “Also, when you are doing something productive, such as contributing to an organisation with volunteer work or helping to take care of your grandchildren, that can provide you with a sense of meaning or purpose, which is another thing that seems to really have positive outcomes for health.” > 5 January 2019 | NewScientist |29 z I = | =z S = STOP YOUR GYM MEMBERSHIP Get more exercise! It is the New Year's pledge that tops many people’s list. While it is a good one, joining a gym might not be the best way to achieve it. “We may need to allocate more time towards being active throughout our day, rather than just checking a box saying we've exercised for 30 minutes,” says Keith Diaz at Columbia University in New York. If you have a desk job—or couch-potato tendencies —this applies to you. Diaz and his colleagues found that adults who regularly sat for1or2 hours at atime hada higher risk of early death than those who spent the same overall amount of time sitting, but who got up and moved every half hour or so. One reason is that our muscles help regulate blood sugar levels, but need to be active to do so. Prolonged sitting can also cause blood to pool in the legs, which can damage blood vessels. Interspersing your day with movement, therefore, seems to be important. But how much is necessary? “Even 1 minute of exercise is enough to prime the muscles and get them contracting and perhaps offset some of the harms of sitting,” says Diaz. However, the more you do, and the more vigorously you do it, the better. His team found that every 30 minutes of 30 | NewScientist | 5 January 2019 sitting that is replaced with light, physical activity reduces your risk of early death by 14 to 17 per cent. Vigorous exercise lowers it by around 36 per cent. “Probably the optimal strategy would be to intersperse sitting with some movement, but also get insome exercise at the beginning or end of the day,” says Diaz. This could be done by, say, cycling to work and back, and ensuring you briefly leave your desk every 30 minutes, or even doing some heel raises while sitting. Another option, if your work environment allows, would be to break up your day with 5 to 10-minute bursts of more vigorous exercise every half hour or so. By the end of the day, you would have completed the equivalent of a gym workout, without setting foot in a gym. Physiologists used to believe that for physical activity to be beneficial it had to occur in bouts lasting 10 minutes or more, but they are increasingly backtracking, says Diaz. A November update to the Physical Activity Guidelines for Americans emphasised that any activity is beneficial. “So many people fail at doing the exercise thing for their New Year's resolution,” says Diaz, “so this might bea different twist on your endeavours to become more active.” STOP QOVERCONSUMING Consider a toaster. To make the metal and plastic components it contains, raw materials must be extracted from the ground, melted or heated, purified and modified, then transported to a factory, or maybe several, to produce the different parts. Once they have been assembled and packaged, the final toasters must be transported again. No wonder our insatiable appetite for new things consumes so much energy. “A sizeable chunk of our overall carbon and biodiversity footprint comes from just the stuff that we buy week in, week out,” says Mike Childs, director of research at Friends of the Earth UK. “Buying stuff comes in at around 44 kWh per day per person, plus 12 kWh to transport Itall,” he says. A whopping 14 kWh per day of this is associated with producing your car. Packaging contributes around 7 kWha day. By comparison, an average Westerner uses around 20 kilowatt-hours (kWh) of energy each day to heat their home. And if you spread the energy cost of taking a long-haul flight across a whole year, it works out at around 30 kWh a day. Clearly, we need to buy some stuff, but we can reduce our impact. “Buying more durable products means you will be buying replacements less often, as does repairing items rather than putting themin the bin,” says Childs. Buying second-hand or refurbished items is another good strategy. What about food? The typical energy costs of food, farming and fertiliser come in at 15 kWh per person per day, says Childs. This is in addition to the other things we buy. Reducing meat consumption is an obvious first step because raising and feeding livestock is so energy-intensive. Cutting food waste could have a big impact too. If food waste werea country, it is estimated that it would have the third-largest carbon footprint, behind the US and China. That is notall. “Agriculture is the single largest threat to global biodiversity, with large amounts of the tropics being cleared to produce food, often for export,” says Erasmus zu Ermgassen at the Catholic University of Louvain (UCL) in Belgium. “Any dent that food waste reduction makes inthe demand for food is therefore a huge benefit, not justin carbon emissions, but in land and water consumption.” It could also save you money - another popular New Year's resolution. Although, if you want to do the right thing by the planet, resist the urge to spend what you save on more stuff. Your Go-To Source for Top-Tier Preparation @MINDLESS_ WRITER STOP LATE-NIGHT SNACKING Increasingly, it seems it is not just what you eat, but when you eat it that matters. So, if you are struggling to lose weight, or simply want to strike a healthier relationship with food, consider imposing a time limit on your biscuit tin. The way we process and metabolise food varies across the day, due to 24-hour rhythms in our liver, pancreas, muscles and even our fat cells. Generally, we are better equipped to handle food consumed during the = daytime, which makes sense 3 given this Is when humans have = evolved to be active. Several = studies have associated late-night eating with an increased risk of diabetes and obesity. Why should this be? Garaulet at the University of Murcia, Spain, and her colleagues compared what happened when the same group of people ate their dinner 4 hours before their habitual bedtime, or an hour before it. Even though they had exactly the same meal, eating later resulted in impaired glucose tolerance - a prediabetic state associated with higher-than- normal sugar levels in the blood. The reason may be melatonin, ahormone we begin to secrete in the evening and continue to release overnight, telling our various organs and tissues to gear up for the night shift. “We think that if you have food together with melatonin, you may have impairments in glucose control or metabolism,” says Garaulet. Supporting this idea, her team found that people with a genetic variant resulting in receptors that are more sensitive to melatonin had higher glucose intolerance when they ate meals not long before going to bed. If weight loss is your goal, then besides avoiding late-night snacking, you might also reconsider your attitudes to daily meals. In a previous study, Garaulet found that when women were put on a weight-loss diet, those who ate the bulk of their calories before 3 pm lost around 25 per cent more body mass than women who consumed the same number of calories but ate more of them later in the day. The adage that one should breakfast like a king, lunch like a prince and dine like a pauper has never seemed truer. In arecent study, Marta STOP SCRIMPING ON SLEEP According to the National Sleep Foundation, most adults need between 7and 9 hours of sleep each night. If you are failing to notch up the recommended hours, consider the consequences. Lack of sleep causes accidents: driving on less than 5 hours’ sleep trebles your risk of having a car crash, for instance. It has been linked with pretty much every major disease going, from heart disease to diabetes to cancer. It interferes with your attention, working memory, organisation and time management. It reduces your ability to fend off infection. It makes you hungry, so you are more likely to overeat. And it affects your mood, leaving you feeling irritable and at greater risk of depression. The good news is that you can avoid all of this with one (seemingly) simple resolution: go to bed earlier. You may see yourself as an owl, but if you don’t feel sleepy until late, one cause could be artificial light. Several studies have shown that when people are camping, which removes much of the artificial light from their evening, their body clocks shift several hours earlier. The knock-on benefit is that they also feel sleepy sooner and get more shut-eye. When camping, it tends to be cooler too, which is another thing to consider, because your core body temperature needs to drop to initiate sleep. To recreate the sleepy camping environment while enjoying the comforts of home, embrace candles, dimmable light bulbs and those that can be adjusted to produce a warmer light, along with apps that filter out blue light from computer and smartphone screens. Lower the thermostat in the run-up to bed: between 16°C and 18°C is considered optimal. Also, if your insomnia is related to stress, perhaps resolve to avoid all work calls and emails in the 2 hours before bed. And, of course, make sure you aren’t hopped up on caffeine or alcohol. Once you have set an earlier bedtime, try to stick to it. Constantly changing your routine is like imposing jet lag on your body —and this isn’t conducive to sleep. So, try to wake up and go to bed at regular times to strengthen your circadian clock and control when you feel sleepy and alert. STOP BEING SO HARD ON YOURSELF If you break your resolutions before January is even out, cut yourself some slack. There is huge variation in the amount of time it takes people to form anew habit: the average is 66 days, but it can take almost an entire year. So, if at first you don’t succeed, relax and give it another go. You don't have to wait until 2020 to try again. @ Linda Geddes is a consultant for New Scientist and author of Chasing the Sun: The new science of sunlight and how it shapes our bodies and minds reater educational and occupational attainment. This helps explain why, with better education, rates of dementia have fallen in developed countries (even if absolute numbers have risen because people live longer). But regardless of your education, there is still time to adopt activities that bring the same benefits. One option is to be socially active (see “Mix and mingle”, page 33). “Anything that people enjoy and has a social component should be fine,” says Stern. If you want to pick a winner though, there seems to be something special about music and language. For instance, people who played aninstrumentas a child, even for a few years, tend to be protected later in life from decline in the brain areas associated with hearing (see chart, left). And people who speak more than one language develop dementia later, on average, than monolinguals. A 2018 study found that musical training and speaking asecond language both help the brain work more efficiently, requiring less energy to accomplish the same cognitive tasks. Music to our ears. > 26 January 2019 | NewScientist | 31 BRAIN HACKS OF THE FUTURE ; 2.Get moving Outlandish ways of dialling back brain age It is one of the lesser known benefits found that impaired hearing hinders are already under investigation of pounding the pavements, but regular people’s ability toremember information physical exercise can do wonders for your they have just heard. Psychobiotics mental fitness. The evidence is conclusive, Why so? The hypothesis is that when you Evidence is mounting that gut bacteria says neuroscientist Arthur Kramer at the struggle to hear, the extra concentration influence how the brain works. Some microbes University of Illinois: “Exercise helps involved comes at the cost of other mental synthesise key brain signalling molecules, and promote a healthy brain and mind.” processes. “I’m so busy trying to focus others affect the expression of receptors in Exercise increases the production of a and recognise the word tress. There is some evidence that meditation and mindfulness practices can help by dialling down inflammation. A 2018 analysis by researchers at the University of Nevada looked at seven studies of how mindfulness meditation helped reduce older people’s stress levels. One study on 34 adults who had taken mindfulness classes over eight weeks found they had significant improvements in memory and verbal fluency. Maybe that’s something to practise next time you are in the dentist’s chair. 5.Find your purpose From zookeepers to doctors, researchers have been asking people for decades what makes their jobs meaningful. The results boil down to six factors. Authenticity, the feeling that you can be your true self at work, was on the list, as was a sense of belonging. If these tally with your working life, it also bodes well for your mind: finding a purpose in life is a sure way to stave off mental decline. One of the largest studies demonstrating this was published in 2017. Nathan Lewis at Carleton University in Canada and his colleagues phoned 3500 people and asked them about their sense of purpose. Those whose answers suggested they felt that their life had direction “As brain workouts go, there is something special about learning an instrument” and their actions were guided by overarching goals tended to perform better when given memory and cognitive tasks. McEwen says this fits with what we already know. A sense of purpose can provide motivation and end up pushing people into activities that help build, you guessed it, cognitive reserve. It tends to make you more active and more social. “And we know that these improve overall health, including brain health,” says McEwen. Finding purpose doesn’t necessarily require you to quit your job and join the Red Cross. As the career surveys showed, meaning comes in many flavours. Maybe your job aligns with your core values. Or maybe your colleagues give you a sense of belonging. If those elements are lacking, volunteering with local organisations, helping to raise your grandchildren or cultivating a hobby youare passionate about can do the trick. 6.Mix and mingle Like it or not, humans are social animals. And it turns out that hanging out with other people can help preserve cognitive health in a similar way to activities like learning an instrument — yes, it is about building that all important cognitive reserve (see “Flex your mental muscle”, page 31). Some of the evidence comes from studies of married couples. In a 2018 analysis, Andrew Sommerlad, a psychiatrist at University College London, and his colleagues demonstrated that being married is strongly associated with a reduced risk of cognitive decline and dementia. He says the differences are probably due to regular conversation and the effort involved in maintaining a good relationship between spouses. So you don’t need to tie the knot to reap the benefits. “There’s no one type of social contact that is better than another,” says Sommerlad. “I'd recommend social contact that youenjoy.” > 26 January 2019 | NewScientist | 33 Your Go-To Source for Top-Tier Preparation @MINDLESS_ WRITER 7.Get your Zs You already know from bitter experience that a bad night’s rest makes you grumpy. But the effects are more insidious. Study after study suggests that not getting enough of the right kind of sleep can have long-term impacts on the brain. One of the most important findings came in 2013, when neuroscientist Maiken Nedergaard, now at the University of Copenhagen in Denmark, demonstrated that during sleep is when the brain gets rid of the biochemical gunk that accumulates throughout the day. That includes the proteins that can build up into the telltale plaques and tangles seen in neurodegenerative diseases like Alzheimer’s. “We now see the function of sleep is to help clean the brain,” says Nedergaard. “It is very important to take sleep seriously and develop strategies to sleep well.” What does that look like? The recommendation is to get 7 to 8 hours every night. We also know that the different phases of sleep have varying functions. For instance, our deep, non-rapid eye movement sleep is known to be involved in laying down new memories. This sleep comes in sections separated by about 2 hours, so if you sleep less than the optimal amount, you are robbing yourself of them. If you struggle to doze off, there are plenty of things to try aside from the standard advice of drinking and smoking less. For example, warnings about the short- wavelength blue light from phones and tablets disrupting the production of the body’s sleep-regulating hormone, melatonin, are Good sleep helps clear out gunk from the brain, staving off cognitive decline spot on. So switch off good few hours before bed. Another neglected factor is having the right temperature in your bedroom. You want to aim for between 18 and 21°C. 8. Mind what you eat The Paleo, the keto, the 5:2, the Atkins — our obsession with fad diets isn’t going away. Most of them claim to keep us physically healthy and shift a little weight. But what should you eat to keep your mind sharp? You might have heard of the benefits of the Mediterranean diet, which recommends eating plenty of fruit, vegetables, whole grains and olive oil. It does seem to keep us healthy, cutting the risk of heart disease and early death. But recently a few studies have begun to suggest it can stave off cognitive decline too. Yet the Mediterranean diet isn’t designed to specifically include foods that we think benefit FIVE THINGS YOU REALLY SHOULDN'T DO brain volume. That was Don't smoke excessively or give up The Hisayama Study, completely are more likely an ongoing investigation to suffer cognitive decline. of a suburban Japanese Those who drink moderately community, has found that smoking in mid to late life not only raises the risk of lung cancer, but also ups the chance of developing dementia. Smokers who quit, even in their 40s or 50s, didn’t see the same rise in risk. Don't binge on booze (or go teetotal) Too much is bad, but so is too little. The latest large studies onalcohol consumption suggest that those who drink fare better. Don't retire early The Whitehall Study, which followed some 3500 UK civil servants as they aged, found that retirement seemed to accelerate cognitive decline, especially related to verbal memory. Don’t gulp down sugar Even one extra sugary drink a day is associated with having significantly reduced total 34 | NewScientist | 26 January 2019 the finding of a 2017 study looking at nearly 4000 people. That drink also worsened memories of personal experiences. Don't lose those last few pounds Being a healthy weight is an all-round good idea. But don't go too far. A study that looked back on the diets of some 2 million people over 20 years found that, compared with people of a healthy weight, underweight people had a 34 per cent higher risk of getting dementia. the brain. So Martha Morris, a nutritionist at Rush University in Chicago, tweaked the Mediterranean diet, trying to optimise it for brain health. The result, which she called the MIND diet, emphasises eating leafy green vegetables and berries, drinking wine, and limiting cheese, sweets and fried food (see diagram, page 32). Berries are on the list because people who eat them generally have better cognitive abilities. This might be because they contain lots of antioxidants, chemicals that protect cells from damaging free radicals. The same is true of leafy vegetables. Foods that are high in saturated fat or sugar are no-nos because of their association with inflammation in the brain and body. To assess the diet, Morris studied 923 people living in retirement homes near Chicago. She randomly assigned them to eat either the Mediterranean diet, another plan called the DASH diet, designed to lower blood pressure, or her MIND diet. She found the MIND diet outperformed the others, lowering the risk of developing Alzheimer’s disease by 53 per cent for those who stuck to it most strictly. In 2017, a larger study backed this up. Ken Langa at the University of Michigan looked at the Health and Retirement Study, a huge study of how people in the US have aged, which has run since 1990. He assessed participants’ diet records and collated data on those who had eaten the Mediterranean or MIND diets. People who stuck to them. had better cognitive performance than those who didn’t. As for the drip-drip of headlines touting the cognitive benefits of individual superfoods, Langa counsels restraint. Protecting your brain with your diet means paying attention to your whole diet, there’s no one food that will doit. = Kayt Sukel is a science writer based in Texas"}, {"title": "Rethinking Alzheimer's", "author": "Debora MacKenzie", "content": "AFTER decades of disappointment, we may have a new lead on fighting Alzheimer’s disease. Compelling evidence that the condition is caused by a bacterium involved in gum disease could prove a game-changer in tackling one of medicine's biggest mysteries, and lead to effective treatments or even a vaccine. As populations have aged, dementia has skyrocketed to become the fifth biggest cause of death worldwide. Alzheimer’s constitutes some 70 per cent of these cases (see “What is Alzheimer’s disease”, below), yet we don’t know what causes it. The condition, which results in progressive loss of memory and cognitive function, usually over a decade or so, is devastating both to those who have it and to their loved ones. The condition often involves the accumulation of two types of proteins— called amyloid and tau-in the brain. As these are among the earliest physical signs of the disease, the leading hypothesis since 1984 has been that the condition is caused by the defective control of these proteins, especially amyloid, which accumulates to form large, sticky plaques in the brain. The bulk of research into understanding and treating Alzheimer’s has centred on this “amyloid hypothesis”. Huge sums of money have been invested in experiments involving mice genetically modified to produce amyloid, and in developing drugs that block or destroy amyloid proteins, or sometimes degraded tangles of tau. It has become clear that this approach isn’t working. In 2018 alone, the US National Institutes of Health spent $1.9 billion on Alzheimer’s research. But according to a recent study, the failure rate of drug development for Alzheimer’s has been 99 per cent. Some have begun to question the amyloid hypothesis. The lack of results has been compounded by the discovery that people—including WHAT IS ALZHEIMER'S DISEASE? There are many types and causes of dementia, but Alzheimer’s disease is the most common form, accounting for between 60 and 70 per cent of all cases. Common early symptoms of Alzheimer’s include short-term memory loss, apathy and depressed mood, but these symptoms are often just seen as being a part of normal ageing, making early diagnosis difficult. 6 | NewScientist | 2 February 2019 some in their 90s with exceptional Alzheimer's memories -— can have brain plaques disease has and tangles without havingdementia. | destroyed neurons in a review of the research to date last in the right-hand year, Bryce Vissel at the University brain above of Technology Sydney, Australia, concluded that there isn’t sufficient data to suggest that “amyloid has a central or unique role in Alzheimer’s”. Doctors diagnose Alzheimer's on The vast majority of people with the basis of medical examination, patient history and cognitive tests, and can use imaging to rule out other forms of dementia. However, a definitive diagnosis of Alzheimer's is only possible after death, when examination of brain tissue can reveal whether a person had the deposits of amyloid and tau proteins (see main story) that are characteristic of the condition. Alzheimer's are diagnosed with the condition after the age of 65, but clumps of amyloid protein can begin to build up in the brain some 15 or 20 years before symptoms appear. We have long hoped for diagnostic tests that can determine if someone has Alzheimer's before death, and spot the condition before extensive brain damage has occurred. Donna Lu In 2016, researchers discovered that amyloid seems to function as a sticky defence against bacteria. They found that the protein can act asan anti-microbial compound that kills bacteria, and when they injected bacteria into the brains of mice engineered to make Alzheimer’s proteins, plaques developed round bacterial cells overnight. At the time, the team said it still believed that amyloid itself went on to cause the brain damage of Alzheimer’s, not bacteria. But a spate of subsequent studies have looked at microbes. Bacteria have been found in the brains of people who had Alzheimer’s when they were alive. But it hasn’t been clear whether the bacteria caused the disease or were simply able to enter brains damaged by Alzheimer's. Multiple teams have been researching Porphyromonas gingivalis, the main bacterium involved in gum disease, which is a known risk factor for For daily news stories, visit newscientist.com/news WHAT IS GUM DISEASE? Gum disease, also known as gingivitis in its mild form, occurs when bacteria accumulate in tooth plaque, causing inflammation, receding gums and bleeding. If it progresses to the more serious form, periodontitis, it can lead to abscesses and tooth loss. Now it turns out that one of the key bacteria that cause gum disease - Porphyromonas gingivalis - may also be a root cause of Alzheimer's disease, a form of dementia (see main story). HOW DOI KNOW IF I HAVE GUM DISEASE? Occasional bleeding from the Fa gums when you clean or floss 2 your teeth doesn’t mean you 2 definitely have gum disease, 3 because you may just have been 2 too rough. But dentists advise that q any bleeding should be checked 3 out. Other signs include soreness 4 around the gums and bad breath. Everything you need to know about gum disease WHAT SHOULD 1DO ABOUT IT? Dentists advise cleaning your teeth twice a day, and flossing or using interdental sticks to remove plaque. But brushing too vigorously can let oral bacteria into the bloodstream, so take it easy. If plaque is allowed to build up, it can turn into hard tartar, which encourages the growth of more plaque towards the tooth roots. Tartar can’t be removed by ordinary brushing, and has to be scraped off at the dentist. WHAT ELSE CAN! DO? You can lower your baseline inflammation levels by sticking to agood diet and exercise regime. If you smoke, stop, because smoking makes gum disease worse and harder to treat. ARE THERE ANY NEW TREATMENTS? Researchers are working on a vaccine and a specific anti-toxin for P gingivalis, but these are some years away from reaching the clinic. DOES HAVING GUM DISEASE MEAN I WILL GET ALZHEIMER'S? No. According to the UK's National Health Service, most adults have gum disease to some extent. There is still much we don't understand, but whether gum disease leads to Alzheimer's may depend on how many of the bacteria you have or how good your body is at dealing with them. WAS ALZHEIMER'S MORE COMMON BEFORE TOOTH BRUSHING? If P. gingivalisis indeed responsible for Alzheimer's, you might think that our ancestors’ poor oral hygiene would have made them more susceptible to the condition. Butin the past, fewer people would have reached the advanced age at which Alzheimer's is more common. Clare Wilson Alzheimer’s. So far, teamshavefound “The bacteria that P gingivalis invadesandinflames in the brain brain regions affected by Alzheimer’s; are notthe that gum infections can worsen result of symptoms in mice genetically Alzheimer's, engineered to have Alzheimer’s; and but they could that it can cause Alzheimer’s-like brain be the cause” inflammation, neural damage and amyloid plaques in healthy mice. Awhole new hypothesis “When science converges from multiple independent laboratories like this, it is very compelling,” says Casey Lynch of Cortexyme, a pharmaceutical firm in San Francisco. Now researchers from Cortexyme and several universities have reported finding the two toxic enzymes that P gingivalis uses to feed on human tissue in 99 and 96 per cent of 54 human Alzheimer’s brain samples taken from the hippocampus -a brain area important for memory (Science Advances, doi.org/gftvdt). These protein-degrading enzymes are called gingipains, and they were found in higher levels in brain tissue that also had more tau fragments and thus more cognitive decline. The team also found genetic material from P. gingivalis in the cerebral cortex —a region involved in conceptual thinking - in all three Alzheimer’s brains they looked for it in. “This is the first report showing P. gingivalis DNA in human brains, and the associated gingipains co-localising with plaques,” says Sim Singhrao at the University of Central Lancashire, UK, who wasn’t involved in the study. Her team has previously found that Pgingivalis actively invades the brains of mice with gum infections. When Lynch and her colleagues looked at brain samples from people without Alzheimer’s, they saw that some had P gingivalis and protein accumulations, but at low levels. We already know that amyloid and tau can accumulate in the brain for 10 or 20 years before Alzheimer’s symptoms begin. This, says the team, shows that Pgingivalis doesn’t get into the brain as a result of Alzheimer’s — but could be the cause. When the team gave P. gingivalis gum disease to mice, it led to brain infection, amyloid production, tangles of tau protein and neural damage in the regions and nerves normally affected by Alzheimer’s. This suggests causation, says Lynch. She adds that P. gingivalis fulfils an updated set of criteria for attributing adisease to a particular pathogen. These conditions are named Koch’s postulates, after Robert Koch, a founder of the germ theory of disease. “The study does address most of Koch’s postulates,” says Robert Genco of the University at Buffalo, New York. “Future studies need to be in humans to be convincing.” > 2 February 2019 | NewScientist | 7 SPECIAL REPORT BAD BACTERIA AND OTHER MICROBES It might seem surprising that amouth bacterium has been implicated in Alzheimer’s disease (see main story). But it wouldn't be the first time anillness has turned out to have an unexpected infectious origin. The iconic case is stomach ulcers, once thought to be caused by stress or excess acid, and treated with acid-lowering medications. Then Australian doctor Barry Marshall showed that a stomach bacterium called Helicobacter pylori was behind them, a feat that won him a Nobel prize. We don’t know how P gingivalis gets “This is why into the brain, but there are plausible routes it could take. Your mouth normally hosts a diverse and relatively stable community of bacteria, but when dental plaque builds under the edge of your gums, it can form Streptococcus bacteria, which cause tonsillitis and “strep throat”, are suspected of triggering obsessive-compulsive disorder in children. The thinking is that the immune system's attack on the bacteria cross-reacts with certain human proteins, causing an autoimmune attack against the person's own brain tissue. Bacteria aren't the only ones under suspicion. There are indications that a virus is behind some cases of obesity. And one study has found that people with antibodies to a single-celled years of efforts totreat Alzheimer’s have seen few results” brain parasite called Toxoplasma gondii, which is spread in cat faeces, are more likely to develop schizophrenia. Some people think up to a third of cases could be caused by infection with T. gondii. But not all purported links bear fruit. Twenty years ago, there was great excitement when a bacterium that can cause pneumonia lung infections was found in the blood vessel plaques that cause heart disease. But giving people antibiotics to kill this bug didn’t help reduce heart attacks. Clare Wilson contain the infection, and this may then kill neurons. Or P gingivalis may directly damage the brain. We already know that Alzheimer’s involves inflammation, an excessive immune response that ends up killing neurons instead of inflamed pockets in which P gingivalis can thrive and release toxins. This inflammation can lead to chronic periodontitis and tooth loss (see “Everything you need to know about gum disease”, page 7), and some studies have shown that people with fewer teeth are more likely to have dementia. The inflammation and toxins caused by P. gingivalis damage the lining of your mouth, which may make it possible for oral bacteria to enter the bloodstream and then other organs. Even if you don’t have gum disease, transient damage to your mouth lining from eating or tooth- brushing can let mouth bacteria into your blood, says Lynch. The blood-brain barrier should protect your brain from microbes, but Pgingivalis can invade white blood cells and the cells lining blood vessels, so might cross it that way. It may also invade cranial nerves near the mouth, then spread from cell to cell towards the brain over a period of years. As to how P gingivalis might cause dementia after it arrives in the brain, there are two clear possibilities. It may trigger the release of amyloid, the brain’s method of trying to 7 2 g Ff Fa # 4 g 8 < 8|NewScientist | 2 February 2019 Porphyromonas gingivalisis the main bacterium in protecting them. P. gingivalis is known to cause inflammation in gum tissue, and it may do so in the brain as well. In response to the new findings, David Reynolds of the Alzheimer’s UK charity said he is dubious that Pgingivalis causes Alzheimer’s, because of the evidence showing that a person’s genes play a crucial role in the disease. “Strong genetic evidence indicates that factors other than bacterial infections are central to the development of Alzheimer’s, so these new findings need to be taken in the context of this existing research,” he said in a statement. But a bacterial hypothesis for Alzheimer’s doesn’t conflict with genetic evidence. The human body’s propensity for inflammation can vary according to genetic variations that affect our immune systems, and this may influence how much damage P gingivalis induces in a brain. The biggest genetic risk factor for Alzheimer’s is a variant of the gene that makes the ApoE immune protein. Last year, a team in Sweden found that the gingipains released by P. gingivalis break up the ApoE protein into fragments, cleaving it at the site of a particular amino acid within the protein, and that these fragments may harm nerves. The ApoE4 variant of this protein contains more of this amino acid, suggesting that the reason people who make this variant are at a higher risk of developing Alzheimer’s may be because harmful levels of ApoE protein fragments build up more quickly in their brains than in those of other people. Hope for treatments The speed at which damage accumulates is a key factor in the disease. Although many people harbour P gingivalis in their mouths, only some develop Alzheimer’s. Because it can be decades before Alzheimer’s symptoms appear, whether a person develops the condition could come down to how much damage occurs before they die of other causes. “Alzheimer’s strikes people who accumulate gingipains and damage in the brain fast enough to develop symptoms during their lifetimes,” says Lynch. She says her team’s findings are a “universal hypothesis of pathogenesis”, fully explaining the causes of Alzheimer’s disease. But Vissel warns that Alzheimer’s is acomplex disease. “The answer is unlikely to be one-cause-fits-all. We need to keep open eyes.” However, the new study is “very exciting”, he says. “Alzheimer’s is socommon in people at advanced age that I think it can only be either some intrinsic property of the brain, oraninfection.” & z = For daily news stories, visit newscientist.com/news ANALYSIS Gum disease and Alzheimer’s: How good is the evidence? THE publication of evidence that gum disease bacteria may cause Alzheimer's (see main story) has prompted questions on social media about how seriously we should take the results. Any well-informed reader will know that correlation doesn't mean causation, and not every link between two factors implies that one causes the other. But some do. Taken together, the new mouse experiments do suggest a causal link between the gum disease bacterium Porphyromonas gingivalis and Alzheimer's. When the team gave these bacteria to mice, the animals developed dementia that looked like human Alzheimer's. The gingipain toxins produced by these bacteria activate certain parts of the immune system, and were found in this study to degrade tau protein. Both effects are known to produce Alzheimer's symptoms. And when the team gave these mice a drug that kills the bacteria, either directly or by blocking the gingipains they use to feed, there was areduction both in bacteria and in symptoms. Together, these satisfy most of the conditions required to attribute a disease to a microorganism. There are hints that the same may be true in humans. Nearly all of the 54 Alzheimer's brain samples studied by the team contained gingipains, and the more gingipains a person had, the more degraded tau protein they had - a sign of worse Alzheimer's symptoms while alive. While 54 people isn't a huge sample, it is large by the standards of much brain research, where tissue can be hard to get. The team also found low levels of gingipains and damage in the brains of some people who didn't have the condition, consistent with the fact that Alzheimer's is the result of years of accumulating brain damage. Some online commenters have expressed doubts over whether a study from a pharmaceutical firm can be “trusted”. But the study was accepted by the peer-reviewed journal Science Advances (doi.org/ gftvdt), and 14 of the 26 authors of the paper aren't directly employed by Cortexyme. Besides, many big pharma companies have pulled out of less profitable drug-development areas, including antibiotics and Alzheimer's, and Cortexyme is typical of the smaller firms that now do most early drug development. it is healthy to be sceptical, and much research is needed to confirm the study, but if we don’t trust commercial firms on principle, we will struggle to find ways to develop badly needed drugs. Debora MacKenzie If this new hypothesis of Alzheimer’s is borne out, the good news is that it could lead to effective treatments for the condition. Although there is plenty you can do to reduce your risk of gum disease, Cortexyme is hoping it can stop or even reverse Alzheimer’s using molecules it has developed that block gingipains. The firm found that giving some of these to mice with P. gingivalis infections reduced brain infection, halted amyloid production, lowered brain inflammation and even rescued damaged neurons. “This provides hope of treating or preventing Alzheimer’s disease one day,” says Singhrao. Cortexyme reported last year that the best of its gingipain blockers had passed initial safety tests in people, and entered the brain. It also seemed to improve symptoms in participants with Alzheimer’s. The firm will launch a larger trial later this year. The company also plans to test the drug against gum disease itself. Efforts to fight that have led a team in Melbourne to develop a vaccine for P. gingivalis that started tests in 2018. Avaccine for gum disease would be welcome -and if it also stops Alzheimer's the impact could be enormous. It is early days for this new hypothesis, and if the pursuit of amyloid-busting drugs over the past few decades has taught us anything, says Vissel, it is that a complex disease may not have a simple mechanism. Even if P. gingivalis is confirmed as a cause of Alzheimer’s, we don’t know yet whether it will turn out to be the only cause or one of several factors contributing to the disease. “This paper is very important,” says George Perry at the University of Texas at San Antonio. “The view that pathogens might be one of several paths leading to Alzheimer’s disease fits my current thoughts of amyloid and tau being critical brain responses to injury, instead of the initiators.” That, he says, is why years of efforts to treat Alzheimer’s by removing those proteins have seen few results: they are symptoms of the disease, not its cause. “This is a further turning point in the understanding that infections and inflammation can be at the heart of Alzheimer's disease.” @ 2 February 2019 | NewScientist |9"}, {"title": "Confused about cancer? (continued)", "author": "Jonathan R. Goodman", "content": "ED meat, cellphones, plastic drinking bottles, artificial sweeteners, power lines, coffee... Which of these have been linked with cancer? If you are unsure, youaren’t alone. The problem isn’t a lack of information. Rather, we are bombarded with somuch information and misinformation about what might cause cancer that it is often hard to separate myth from reality. Yet it is something we must all do, because cancer affects every one of us. Whether or not you have had it yourself, you surely know someone who has. For people in the UK, the lifetime chance of being diagnosed with the disease is 1 in 2. Globally, cancer is second only to cardiovascular disease as a cause of death, killing an estimated 1 in 6 people. Cancer is not a single disease and its causes are many and complex, but there are things we can do to reduce our risk—if only we could identify them. That isn’t easy when even the experts don’t always agree. Nevertheless, our knowledge has come a long way in recent years, thanks to a huge amount of research into both environmental factors and genetic susceptibility. So, what do we know-and don’t know -—about the causes of cancer? And, when faced with mixed messages, how can we best judge the risks for ourselves? > Theextent of public confusion on the ¥ subject was glaringly exposed in a survey of i 1330 people in England published last year. § Researchers from University College London 2 and the University of Leeds, UK, reported 2 that more thana third of the general public mistakenly attributed carcinogenic properties to artificial sweeteners, genetically modified food, drinking from plastic bottles and using acellphone. Over 40 percent thought stress causes cancer, although there is no proven link. More worryingly, only 60 per cent of people believed sunburn can lead to cancer. And only 30 per cent were aware of the strong link between human papillomavirus (HPV) infection and the disease. Many commentators were surprised by these findings, but they probably shouldn't have been. When it comes to cancer, the disconnect between people's beliefs and scientific findings has deep roots. Take, for example, the controversy over aspartame. Over the past half-century, this artificial sweetener has been the subject of intense debate, with public opinion waxing and waning about whether it causes brain cancer. There are plenty of internet articles describing aspartame as a carcinogen. Yet there is no conclusive evidence that it can trigger mutations that cause cells to proliferate out of control, which is the hallmark of cancer. The same goes for antiperspirants, water fluoridation, power lines, smart meters, cleaning products and countless other things. It would be wrong to conclude that we are “A third of people mistakenly think that drinking from plastic bottles can give you cancer” simply gullible or ignorant. In fact, public opinion isn’t always unfounded. The belief that injuries can cause cancer has been rejected as a myth by cancer experts, including the authors of the UCL/Leeds study, yet research published in 2017 indicates that there may indeed be a link. Besides, there is real uncertainty about the carcinogenic properties of various substances. Take coffee. Last year, a judge in California ruled that all coffee sold in the state should carry a cancer warning because coffee contains acrylamide, which may be carcinogenic. Not long after, California officials rejected the ruling, to the relief of coffee-drinkers everywhere. Yet coffee does contain acrylamide, which the World Health Organization (WHO) describes as a “probable human carcinogen” — despite there being no clear evidence that it increases the risk of any type of cancer in humans. And its presence in fried, roasted and baked foods is the reason we are advised to avoid eating overcooked chips, burnt toast and the like. But whether your morning cup of coffee contains enough to make it a cancer risk isn’t known, as there has been insufficient research to settle the matter. Even where there is a lot of research, results are often open to interpretation. That is partly because both the main approaches to testing potential carcinogens have drawbacks. Laboratory studies using live animals or their cells can be rigorous but the results may not apply to humans. Studies in people, meanwhile, are difficult to interpret because many confounding factors influence the > 9 February 2019 | NewScientist | 35 Your Go-To Source for Top-Tier Preparation @MINDLESS_ WRITER"}, {"title": "Creative people have more mental health issues", "author": "Alice Klein", "content": "ARTISTIC talent may really be linked to a higher likelihood of experiencing mental health conditions, according to a study of people in Sweden. The Greek philosopher Plato noted that creative people often seemed to possess “divine madness” ~a stereotype later applied to Vincent Van Gogh, Salvador Dali and Edvard Munch. However, good studies on the subject have been lacking. Now, James MacCabe at King’s College London and his colleagues have pored over the health and education records of the entire population of Sweden, focusing on the mental health of people who had done subjects like art, music or drama at university. They found that those who had studied an artistic subject were go percent more likely to be hospitalised for schizophrenia, compared with the general population. Such people were also 62 per cent more likely to be admitted for bipolar disorder, and 39 per cent more likely to be admitted for depression (British Journal of Psychiatry, doi.org/ cngg). These hospitalisations usually occurred after university, most commonly in people’s mid- 30s. Those with law degrees didn’t have the same elevated risks, suggesting psychiatric conditions are not simply linked to university education, says MacCabe. The findings are consistent with a 2015 study of 86,000 people in Iceland, which found that artists, musicians and other creative professionals were slightly more likely to have genetic variants linked to schizophrenia and bipolar disorder. It may be that the same genetic variants that unleash creativity can also trigger mental health conditions, says MacCabe. “Creativity often involves linking ideas or concepts in ways that other people wouldn't think of,” he says. “But that’s similar to how delusions work— for example, seeing a connection between the colour of someone’s clothes and being part of an MIS conspiracy.” People who feel things deeply may have more internal creative inspiration but greater emotional instability, says MacCabe. “Someone who is moved to tears by looking at a painting may have greater artistic sensitivity but also be more vulnerable to depression,” he says. Creativity often involves linking ideas that others wouldn't think of But the study has some limitations, including the way it used arts degrees as a proxy for creativity. “It’s not ideal because many highly creative people are not studying art,” says Shelley Carson at Harvard University. Artists shouldn't feel too worried because the risks are small, says Jeremy Hall at Cardiff University, UK. Inthe Sweden study, schizophrenia still only affected 1 in 115 artistic people. “My advice to artists would be the same as to anyone else worried about developing psychosis,” says Hall. “Don’t smoke cannabis and try to lead a generally healthy life.” Alice Klein m"}, {"title": "Turing trick turns salt water drinkable fast", "author": "Andy Coghlan", "content": "MORE than 300 million people depend on drinking water extracted from the sea, but the desalination process is often inefficient. Now an idea that computing pioneer Alan Turing had nearly 70 years ago is being used to speed it up. Two basic desalination methods exist: boiling sea water to make water vapour for collection, or pumping it through membranes that extract salt.  With membranes, though, there is a trade-off between the flow rate and how much salt they capture. Inspired by Turing’s only paper on chemistry, Lin Zhang at Zhejiang University in Hangzhou, China, and his colleagues have made membranes that allow water through much faster without sacrificing salt uptake. Made of polyamide plastic, the membranes exploit unusual surface patterns called Turing structures that the legendary codebreaker theorised in 1952. Some are covered with tiny welts or bubbles. Others have longer, ridge-shaped welts that appear stripy when magnified. To make these bumps, researchers must both speed up and slow down achemical reaction at the same time - in this case, while assembling long chains of monomeric building blocks to form polyamide. To achieve this, the team added a substance that activated this polymerisation and another that blocked it. Crucially, one diffuses through faster than the other, so polymers form only in some zones, resulting in the bumpy surface. “The salt removal exploits unusual patterns called Turing structures, first theorised in 1952” The team put water laced with gold nanoparticles through the membrane and found the gold collected around the bubbles and stripes, indicating the water was passing through these locations. Larger particles like salt are trapped in the uneven surface structures. The welts are the secret, says Zhang - they remove salt up to five times faster than conventional desalination membranes can (Science, doi.org/cn8r). When pitted against 16 commercially available rivals, the membranes with Turing structures outperformed them all. Andy Coghlan @"}, {"title": "Add-on for surfboards can fend off sharks", "author": "Alice Klein", "content": "AN ELECTRIC device that attaches to surfboards could halve a surfer’s risk of getting attacked by sharks. Although rare, shark attacks are on the rise, with the number worldwide going from about 20 to 80 cases a year over the past three decades. Many shark repellent products for surfers are now on sale, but few have been rigorously and independently tested. Sina Habibi has a similar goal for an app released by his company Cognetivity, a University of Cambridge spin- out. Cognetivity’s 5-minute test, played on an iPad, shows users a variety of scenes in rapid succession. Their task is to pick out those that contain animals as quickly as possible. Habibi’s team chose to focus on visual processing because this is another Charlie Huveneers at Flinders University in Australia and his colleagues decided to assess five of the most popular products. These included two devices that create electric fields, two that create magnetic fields, and a smelly wax. The researchers carried out 50 trials per product, attaching or applying it to surfboards placed 30 kilometres off the coast of South Australia - in waters where sharks are fairly common. A piece of tuna dangling below each board mimicked a surfer's foot, while an underwater camera filmed any shark interactions. of the first skills to decline in the early stages of dementia. BrainTest takes yet another approach. Developed by a Canada- based company, it is based on existing tests that assess a range of cognitive skills, including the ability to perform calculations, spatial orientation and language. If youask any of the companies involved, they will say their own test is the best, says Carol Routledge, head of research at Alzheimer’s Research UK, based in Cambridge. Given that all the tests focus on different aspects of brain function, which one gives us the best indication of dementia? “We don’t know,” says Four of the products had no significant effect, the team found in areport published by the government of New South Wales. But a device made by an Australian company called Ocean Guardian halved the number of shark attacks on the bait. The device attaches to the tail of a surfboard and is designed to create astrong electric field. The aim is to overwhelm the sensory receptors that “The aim is to overwhelm the sensory receptors that sharks use to detect weak electric signals from prey” Routledge, “because we don’t [yet] diagnose dementia early enough.” As more people use the apps, a winning strategy may eventually emerge. However, even if one day we learn that visual processing, for example, is the first sign of the onset of dementia, it would take alot more work to figure out exactly which form of dementia will probably develop. “There are up to 80 different diseases that can cause dementia,” says James Pickett, head of research at the Alzheimer’s Society, a London-based charity. The various forms can affect different regions of the brain in their own ways and symptoms can vary, so it is important to be able to tell them apart. Most people with dementia aren't diagnosed until their 70s and 80s, when symptoms are noticeable. The underlying brain changes are thought to start some two to three decades before then, soa simple test for early dementia is a worthy goal, says Pickett. To date, all of the hundreds of clinical trials of drugs for dementia have failed — probably because the tests involved people whose brain damage was already too severe to be remedied, he says. If there were a way to identify such people in the first stages of the disease, we would have a much better chance of treating them successfully. m sharks use to detect weak electric signals from prey, says Huveneers. Although it didn’t eliminate shark attacks in the trials, the device may actually work better in real-life contexts, says Huveneers. That's because the tuna was probably more enticing to sharks than human flesh, given that tuna is part of their natural diet, he says. “I think that overall, there's probably never going to be one silver bullet that stops all shark attacks,” says Huveneers. “That's why we need to keep doing research on all possible mitigation strategies.” Alice Klein @ QJune 2018 | NewScientist | 13"}, {"title": "Mystery gibbon found in ancient royal tomb", "author": "Andy Coghlan", "content": "AROUND 2200 years ago, the grandmother of the first emperor of China was laid to rest. But Lady Xia was not alone in death. Buried alongside her was a previously- unknown species of gibbon, and the ape was probably her pet. Lady Xia’s tomb in modern-day Shaanxi, the second largest known in China, was excavated in 2004. Inside, the partial facial bone and lower mandible of an ape was found. Now, 8 | NewScientist | 30 June 2018 analysis of the bones has revealed it to be an entirely new species. The ape was identified by Sam Turvey at the Institute of Zoology in London and his team, who named it Junzi imperialis. The facial bone (pictured) has upper teeth including two large canines, the nose cavity and part of the eye socket and forehead. The mandible also includes teeth. Enough detail remained for distinctive features in the cranial bone and teeth to be compared with corresponding ones from data sets of hundreds of gibbons from present-day species. The comparisons revealed Junzi was also anew genus, the first time the FDA has approved a drug that contains a purified form of marijuana. The drug contains no THC. “There is currently very little scientific evidence to support cannabis oil containing both THC and cannabidiol as a treatment for epilepsy,” said the charity Epilepsy Action, in a statement. Are cannabis-based medications available for other conditions? They are. A synthetic version of THC called nabilone has been used since the 1980s to treat nausea after chemotherapy. Adrug called Sativex is
