        let currentIndex = 0;
        let animationDirection = 'left';

        function loadProgress() {
            try {
                const saved = localStorage.getItem('readingProgress');
                if (saved !== null) {
                    const idx = parseInt(saved, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < readings.length) {
                        currentIndex = idx;
                    }
                }
            } catch (e) {
                // ignore
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('readingProgress', currentIndex.toString());
            } catch (e) {
                // ignore
            }
        }

        function formatContent(text) {
            // Split into sentences and group into paragraphs
            const sentences = text.match(/[^.!?]+[.!?]+["\'\u2019]?\s*|[^.!?]+$/g) || [text];
            const paragraphs = [];
            let currentPara = [];
            let sentenceCount = 0;
            const targetSentences = 5;

            for (let i = 0; i < sentences.length; i++) {
                const sentence = sentences[i].trim();
                if (!sentence) continue;
                currentPara.push(sentence);
                sentenceCount++;

                if (sentenceCount >= targetSentences || i === sentences.length - 1) {
                    paragraphs.push(currentPara.join(' '));
                    currentPara = [];
                    sentenceCount = 0;
                }
            }

            if (currentPara.length > 0) {
                paragraphs.push(currentPara.join(' '));
            }

            return paragraphs.map(function(p) {
                return '<p>' + escapeHtml(p) + '</p>';
            }).join('');
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function renderReading() {
            const reading = readings[currentIndex];
            const card = document.getElementById('reading-card');

            card.className = 'reading-card px-5 pt-20 pb-28 ' + (animationDirection === 'left' ? 'slide-left' : 'slide-right');

            document.getElementById('reading-title').textContent = reading.title;
            document.getElementById('reading-author').textContent = reading.author && reading.author !== 'Unknown' ? 'By ' + reading.author : '';
            document.getElementById('reading-number').textContent = '#' + (currentIndex + 1);
            document.getElementById('reading-content').innerHTML = formatContent(reading.content);

            updateProgress();

            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === readings.length - 1;

            if (currentIndex === 0) {
                btnPrev.style.opacity = '0.25';
            } else {
                btnPrev.style.opacity = '1';
            }

            if (currentIndex === readings.length - 1) {
                btnNext.style.opacity = '0.25';
            } else {
                btnNext.style.opacity = '1';
            }

            saveProgress();
            window.scrollTo(0, 0);
        }

        function updateProgress() {
            const progress = ((currentIndex + 1) / readings.length) * 100;
            document.getElementById('progress-text').textContent = 'Reading ' + (currentIndex + 1) + ' / ' + readings.length;
            document.getElementById('percentage-text').textContent = Math.round(progress) + '%';
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        function goToNext() {
            if (currentIndex < readings.length - 1) {
                animationDirection = 'left';
                currentIndex++;
                renderReading();
            }
        }

        function goToPrev() {
            if (currentIndex > 0) {
                animationDirection = 'right';
                currentIndex--;
                renderReading();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                goToPrev();
            }
        });

        // Touch swipe support
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const xDiff = Math.abs(touchStartX - touchEndX);
            const yDiff = Math.abs(touchStartY - touchEndY);

            // Only handle horizontal swipes (ignore vertical scrolling)
            if (xDiff > yDiff && xDiff > 60) {
                if (touchStartX > touchEndX) {
                    goToNext();
                } else {
                    goToPrev();
                }
            }
        }, { passive: true });

        // Button click handlers
        document.getElementById('btn-prev').addEventListener('click', goToPrev);
        document.getElementById('btn-next').addEventListener('click', goToNext);

        // Initialize
        loadProgress();
        renderReading();
    </script>
</body>
</html>
